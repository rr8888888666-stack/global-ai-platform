  }

  // ------ Heatmap matrix: Country x Cost Category ------
  function buildHeatmap() {
    const lang = I18N.get();
    const cats = ['base','variable','overtime','mobility','benefit','tax','employer'];
    const catLabels = {
      base: lang==='zh'?'固定薪酬':'Fixed',
      variable: lang==='zh'?'变动激励':'Variable',
      overtime: lang==='zh'?'加班':'Overtime',
      mobility: lang==='zh'?'派遣':'Mobility',
      benefit: lang==='zh'?'福利':'Benefit',
      tax: lang==='zh'?'税务':'Tax',
      employer: lang==='zh'?'雇主':'Employer'
    };
    const rows = MOCK.countryCost.map(c => lang==='zh'?c.cn:c.en);
    const cols = cats.map(c => catLabels[c]);
    const matrix = MOCK.countryCost.map(c => cats.map(k => c[k]));
    return { rows, cols, matrix, raw: MOCK.countryCost };
  }

  // ------ Department workload risk ------
  function deptWorkloadRisk() {
    return MOCK.deptCost.map(d => {
      // synthetic workload index
      const ot = (d.total*0.04) / d.hc;
      const cph = d.total/ d.hc;
      const risk = Math.min(100, Math.round(50 + ot/100 + (d.mom>0.15?15:0) + (d.yoy>0.20?15:0)));
      return { id:d.id, cn:d.cn, en:d.en, hc:d.hc, cph, risk };
    });
  }

  // ------ Compensation composition for current month ------
  function compositionCurrent() {
    const lang = I18N.get();
    const sum = MOCK.countryCost.reduce((acc, c) => {
      acc.base+=c.base; acc.variable+=c.variable; acc.overtime+=c.overtime;
      acc.mobility+=c.mobility; acc.benefit+=c.benefit; acc.tax+=c.tax; acc.employer+=c.employer;
      return acc;
    }, {base:0,variable:0,overtime:0,mobility:0,benefit:0,tax:0,employer:0});
    return [
      { name: lang==='zh'?'固定薪酬':'Fixed',     value:sum.base,     color:'#e60012' },
      { name: lang==='zh'?'变动激励':'Variable',  value:sum.variable, color:'#3b82f6' },
      { name: lang==='zh'?'加班/假期':'Overtime', value:sum.overtime, color:'#f59e0b' },
      { name: lang==='zh'?'派遣成本':'Mobility',  value:sum.mobility, color:'#8b5cf6' },
      { name: lang==='zh'?'福利':'Benefits',      value:sum.benefit,  color:'#10b981' },
      { name: lang==='zh'?'税务':'Tax',           value:sum.tax,      color:'#06b6d4' },
      { name: lang==='zh'?'雇主缴款':'Employer',  value:sum.employer, color:'#ec4899' }
    ];
  }

  return {
    globalKPI, concentration, linearForecast, zScoreAnomalies,
    healthScore, mom, yoy, aiInsights, buildHeatmap,
    deptWorkloadRisk, compositionCurrent,
    // multi-dataset helpers
    deltaClass, heatClass, formatDelta, varianceCells,
    pivotByDim, mergeDatasetsByDim
  };

  /* ============================================================
     Multi-dataset comparison utilities
     ============================================================ */
  function deltaClass(v) {
    if (v == null || isNaN(v)) return 'cmp-cell-flat';
    if (Math.abs(v) < 0.005) return 'cmp-cell-flat';
    if (v >= 0.20) return 'cmp-cell-danger';   // ↑ ≥ 20%
    if (v >= 0.05) return 'cmp-cell-up';
    if (v <= -0.10) return 'cmp-cell-warn';    // 暴跌也告警
    if (v < 0) return 'cmp-cell-down';
    return 'cmp-cell-flat';
  }
  function heatClass(absRatio) {
    // absRatio: 0..1, share/contribution
  if (absRatio == null || isNaN(absRatio)) return '';
    if (absRatio >= 0.40) return 'heat-4';
    if (absRatio >= 0.25) return 'heat-3';
    if (absRatio >= 0.15) return 'heat-2';
    if (absRatio >= 0.05) return 'heat-1';
    return '';
  }
  function formatDelta(v) {
    if (v == null || isNaN(v)) return '—';
    const sign = v >= 0 ? '▲' : '▼';
    return `${sign} ${(Math.abs(v)*100).toFixed(1)}%`;
  }
  function varianceCells(curr, prev) {
    if (prev == null || prev === 0) return { delta:null, pct:null, cls:'cmp-cell-flat', txt:'—' };
    const delta = curr - prev;
    const pct = delta / Math.abs(prev);
    return { delta, pct, cls: deltaClass(pct), txt: formatDelta(pct) };
  }

  /**
   * Pivot multiple full datasets along a dimension.
   * @param datasets Array of {meta, aggregated}
   * @param dim 'country' | 'dept' | 'payGroup' | 'period' | 'entity'
   * @param metric 'total'|'base'|'variable'|'overtime'|'mobility'|'benefit'|'tax'|'employer'|'hc'
   * @returns {rows:[], cols:[label], matrix:[[v]], totals:{row:[],col:[]}}
   */
  function pivotByDim(datasets, dim, metric) {
    const colLabel = ds => {
      const pg = ds.payGroup || (ds.meta && ds.meta.payGroup);
      const per = ds.period || (ds.meta && ds.meta.period);
      const nm = ds.name || (ds.meta && ds.meta.name);
      if (pg && per) return pg + ' · ' + per;
      return nm || pg || per || '?';
    };
    const cols = datasets.map(colLabel);
    const rowSet = new Set();
    const dsMeta = ds => ({
      payGroup: ds.payGroup || (ds.meta && ds.meta.payGroup),
      period:   ds.period   || (ds.meta && ds.meta.period),
      entity:   ds.entity   || (ds.meta && ds.meta.entity)
    });
    const get = (ds, key) => {
      const ag = ds.aggregated || {};
      const m = dsMeta(ds);
      if (dim === 'country') {
        const row = (ag.countryCost||[]).find(c => c.code === key || c.cn===key || c.en===key);
        return row ? (row[metric] || 0) : 0;
      }
      if (dim === 'dept') {
        const row = (ag.deptCost||[]).find(c => c.id === key);
        return row ? (row[metric] || 0) : 0;
      }
      if (dim === 'payGroup') return (m.payGroup === key) ? (ag.countryCost||[]).reduce((s,c)=>s+(c[metric]||0),0) : 0;
      if (dim === 'period')   return (m.period   === key) ? (ag.countryCost||[]).reduce((s,c)=>s+(c[metric]||0),0) : 0;
      if (dim === 'entity')   return (m.entity   === key) ? (ag.countryCost||[]).reduce((s,c)=>s+(c[metric]||0),0) : 0;
      return 0;
    };
    datasets.forEach(ds => {
      const ag = ds.aggregated || {};
      const m = dsMeta(ds);
      if (dim === 'country') (ag.countryCost||[]).forEach(c => rowSet.add(c.code));
      else if (dim === 'dept') (ag.deptCost||[]).forEach(d => rowSet.add(d.id));
      else if (dim === 'payGroup') m.payGroup && rowSet.add(m.payGroup);
      else if (dim === 'period')   m.period   && rowSet.add(m.period);
      else if (dim === 'entity')   m.entity   && rowSet.add(m.entity);
    });
    const rows = [...rowSet];
    const matrix = rows.map(r => datasets.map(ds => get(ds, r, null)));
    const rowTotals = matrix.map(r => r.reduce((s,v)=>s+v,0));
    const colTotals = cols.map((_, ci) => matrix.reduce((s,r) => s + r[ci], 0));
    const totalSum  = rowTotals.reduce((s,v)=>s+v,0);
    return { rows, cols, matrix, rowTotals, colTotals, totalSum };
  }

  /**
   * Build merged country/dept tables that include MoM-style variance vs first column.
   */
  function mergeDatasetsByDim(datasets, dim, metric) {
    const pivot = pivotByDim(datasets, dim, metric);
    const base = pivot.matrix.map(r => r[0]);
    const variance = pivot.matrix.map((r, i) =>
      r.map((v, ci) => ci === 0 ? null : varianceCells(v, base[i]))
    );
    return { ...pivot, variance };
  }
})();

  /* ==================== DATASETS (multi-upload library) ==================== */
  function datasets() {
    const list = (window.Datasets && Datasets.list()) || [];
    const activeIds = (window.Datasets && Datasets.activeIds()) || [];
    const fmtDate = ts => { try { return new Date(ts).toLocaleString(); } catch(e){ return ''; } };
    const cards = list.length ? list.map(d => {
      const checked = activeIds.includes(d.id) ? 'checked' : '';
      return `
        <div class="ds-card" data-id="${d.id}">
          <label class="ds-check">
            <input type="checkbox" class="ds-toggle" data-id="${d.id}" ${checked}/>
            <div class="ds-card-body">
              <div class="ds-card-title">${d.name || '(unnamed)'}</div>
              <div class="ds-card-meta">
                <span class="tag">PayGroup: ${d.payGroup || '-'}</span>
                <span class="tag">Period: ${d.period || '-'}</span>
                <span class="tag">Entity: ${d.entity || '-'}</span>
                <span class="tag">Records: ${d.recordCount ?? '-'}</span>
              </div>
              <div class="ds-card-foot">Uploaded: ${fmtDate(d.uploadedAt)} · ID: ${d.id.slice(0,8)}</div>
            </div>
          </label>
          <div class="ds-actions">
            <button class="btn btn-sm btn-rename" data-id="${d.id}">Rename</button>
            <button class="btn btn-sm btn-use" data-id="${d.id}">Use as Active</button>
            <button class="btn btn-sm btn-danger btn-del" data-id="${d.id}">Delete</button>
          </div>
        </div>`;
    }).join('') : `<div class="empty-state">No datasets yet. Upload a Workday report on the Upload page; it will be saved here for cross-comparison.</div>`;

    $('#content').innerHTML = `
      ${pageHeader('datasets.title','datasets.desc')}
      <div class="row">
        <div class="card col-12">
          <div class="card-head">
            <div class="card-title">Saved Datasets (${list.length})</div>
            <div class="card-actions">
              <button class="btn btn-sm" id="ds-refresh">Refresh</button>
              <button class="btn btn-sm" id="ds-go-compare">Go to Compare ▶</button>
              <button class="btn btn-sm btn-danger" id="ds-clear-all">Clear All</button>
            </div>
          </div>
          <div class="ds-list">${cards}</div>
        </div>
      </div>`;

    document.querySelectorAll('.ds-toggle').forEach(el =>
      el.addEventListener('change', e => App.toggleDatasetActive(e.target.dataset.id, e.target.checked)));
    document.querySelectorAll('.btn-rename').forEach(el =>
      el.addEventListener('click', e => App.renameDataset(e.currentTarget.dataset.id)));
    document.querySelectorAll('.btn-del').forEach(el =>
      el.addEventListener('click', e => App.deleteDataset(e.currentTarget.dataset.id)));
    document.querySelectorAll('.btn-use').forEach(el =>
      el.addEventListener('click', e => App.setActiveDataset(e.currentTarget.dataset.id)));
    const ref = document.getElementById('ds-refresh');
    if (ref) ref.addEventListener('click', () => App.refresh());
    const gc = document.getElementById('ds-go-compare');
    if (gc) gc.addEventListener('click', () => App.navigate('compare'));
    const ca = document.getElementById('ds-clear-all');
    if (ca) ca.addEventListener('click', () => App.clearAllDatasets());
  }

              <select class="filter" id="cmp-metric">${metricOpts.map(o=>`<option value="${o.v}" ${o.v===curMet?'selected':''}>${o.t}</option>`).join('')}</select>

  async function renderCompareBody() {
    const body = document.getElementById('cmp-body');
    if (!body) return;
    body.innerHTML = `<div class="empty-state">Loading datasets…</div>`;
    const datasets = await Datasets.getActiveFull();
    if (!datasets || datasets.length === 0) {
      body.innerHTML = `<div class="empty-state">No active datasets.</div>`; return;
    }
    const dim = window.__cmpState.dim;
    const metric = window.__cmpState.metric;
    const merged = Analytics.mergeDatasetsByDim(datasets, dim, metric);
    const cur = (datasets[0] && datasets[0].records && datasets[0].records[0] && datasets[0].records[0].currency) || 'CNY';
    const isMoney = metric !== 'hc';
    const fmtVal = v => v == null ? '-' : (isMoney ? Analytics.formatCurrency(v, cur) : Math.round(v).toLocaleString());

    // ----- All sub-metrics for drill-down (so each row can show breakdown) -----
    const ALL_METRICS = [
      {k:'total',    t:'Total Cost'},
      {k:'base',     t:'Base Pay'},
      {k:'variable', t:'Variable Pay'},
      {k:'overtime', t:'Overtime'},
      {k:'mobility', t:'Mobility'},
      {k:'benefit',  t:'Benefits'},
      {k:'tax',      t:'Tax'},
      {k:'employer', t:'Employer Contrib.'},
      {k:'hc',       t:'Headcount'}
    ];

    // ----- Pre-compute sub-merged for every metric so drill-down is instant -----
    const subMerged = {};
    ALL_METRICS.forEach(m => {
      subMerged[m.k] = Analytics.mergeDatasetsByDim(datasets, dim, m.k);
    });

    // ----- Color legend bar (key for users) -----
    const legend = `
      <div class="cmp-legend-bar">
        <span class="legend-title">📊 颜色含义 / Color Key:</span>
        <span class="cmp-legend-item lg-danger">🔴 ↑ ≥20%  成本暴涨</span>
        <span class="cmp-legend-item lg-up">🟠 ↑ 5–20%  上升</span>
        <span class="cmp-legend-item lg-flat">⚪ ±0.5%  平稳</span>
        <span class="cmp-legend-item lg-down">🔵 ↓ 0–10%  下降</span>
        <span class="cmp-legend-item lg-warn">🟡 ↓ ≥10%  大幅下降(也需关注)</span>
        <span style="margin-left:auto;color:#64748b;font-size:11.5px">💡 点击任意行展开 → 查看 9 个指标的完整分解</span>
      </div>`;

    // ----- Helper: render a single delta cell with big badge -----
    const renderDeltaCell = (val, vc, isFirstCol) => {
      if (isFirstCol) {
        return `<td><div class="cmp-val">${fmtVal(val)}</div>
                    <div class="cmp-delta" style="background:#e0e7ff;color:#3730a3;border-color:#a5b4fc">
                      <span class="arrow">★</span> 基线 / Base
                    </div></td>`;
      }
      if (!vc) return `<td><div class="cmp-val">${fmtVal(val)}</div></td>`;
      const cls = vc.cls || 'cmp-cell-flat';
      const arrow = vc.delta > 0 ? '▲' : vc.delta < 0 ? '▼' : '●';
      const pct = vc.delta == null ? '—' : `${vc.delta >= 0 ? '+' : ''}${(vc.delta*100).toFixed(1)}%`;
      return `<td class="${cls}">
        <div class="cmp-val">${fmtVal(val)}</div>
        <div class="cmp-delta"><span class="arrow">${arrow}</span> ${pct}</div>
      </td>`;
    };

    // ----- Header row -----
    const head = `<tr>
        <th style="width:36px"></th>
        <th>${dim.toUpperCase()}</th>
        ${merged.cols.map((c,i)=>`<th>${c}${i===0?' <span class="tag tag-blue">基线</span>':''}</th>`).join('')}
      </tr>`;

    // ----- Body rows + drill-down rows -----
    const rowsHtml = merged.rows.map((r, ri) => {
      const cells = merged.matrix[ri].map((v, ci) => {
        const vc = ci === 0 ? null : merged.variance[ri][ci];
        return renderDeltaCell(v, vc, ci === 0);
      }).join('');
      const rowSum = merged.matrix[ri].reduce((s,v)=>s+(v||0),0);
      const heat = Analytics.heatClass(rowSum / (merged.totalSum || 1));
      const rowKey = String(r).replace(/[^a-zA-Z0-9_-]/g, '_') + '_' + ri;

      // Drill-down panel: full 9-metric breakdown for this row
      const drill = ALL_METRICS.map(m => {
        const sm = subMerged[m.k];
        const idx = sm.rows.findIndex(x => x === r);
        if (idx < 0) return '';
        const subCells = sm.cols.map((c, ci) => {
          const v = sm.matrix[idx][ci];
          const vc = ci === 0 ? null : sm.variance[idx][ci];
          if (ci === 0) {
            const fmt = m.k === 'hc' ? Math.round(v).toLocaleString() : Analytics.formatCurrency(v, cur);
            return `<td><div class="cmp-val">${fmt}</div><div class="cmp-delta" style="background:#e0e7ff;color:#3730a3;border-color:#a5b4fc"><span class="arrow">★</span> 基线</div></td>`;
          }
          if (!vc) return '<td>-</td>';
          const fmt = m.k === 'hc' ? Math.round(v).toLocaleString() : Analytics.formatCurrency(v, cur);
          const arrow = vc.delta > 0 ? '▲' : vc.delta < 0 ? '▼' : '●';
          const pct = vc.delta == null ? '—' : `${vc.delta >= 0 ? '+' : ''}${(vc.delta*100).toFixed(1)}%`;
          return `<td class="${vc.cls || ''}">
            <div class="cmp-val" style="font-size:12.5px">${fmt}</div>
            <div class="cmp-delta"><span class="arrow">${arrow}</span> ${pct}</div>
          </td>`;
        }).join('');
        return `<tr class="drill-sub" style="background:#fafbff">
          <td></td>
          <td style="padding-left:30px;color:#475569;font-weight:600">└ ${m.t}</td>
          ${subCells}
        </tr>`;
      }).join('');

      return `<tr class="${heat} cmp-main-row" data-rowkey="${rowKey}" style="cursor:pointer">
          <td style="text-align:center;color:#94a3b8;font-weight:700;font-size:14px" class="cmp-arrow">▶</td>
          <td><b>${r}</b></td>
          ${cells}
        </tr>
        <tbody class="cmp-drill" data-rowkey="${rowKey}" style="display:none">
          <tr><td colspan="${merged.cols.length+2}" style="background:#eef2ff;padding:8px 14px;color:#3730a3;font-size:12px;font-weight:700">
            🔍 ${r} — 9 个成本维度的完整环比分解
          </td></tr>
          ${drill}
        </tbody>`;
    }).join('');

    // ----- Total row -----
    const totalRow = `<tr class="row-total">
        <td></td>
        <td><b>TOTAL</b></td>
        ${merged.cols.map((c, ci) => {
          const sum = merged.matrix.reduce((s,r)=>s+(r[ci]||0),0);
          if (ci === 0) {
            return `<td><div class="cmp-val"><b>${fmtVal(sum)}</b></div>
                        <div class="cmp-delta" style="background:#e0e7ff;color:#3730a3;border-color:#a5b4fc"><span class="arrow">★</span> 基线</div></td>`;
          }
          const baseSum = merged.matrix.reduce((s,r)=>s+(r[0]||0),0);
          const vc = Analytics.varianceCells(sum, baseSum);
          return renderDeltaCell(sum, vc, false).replace('<td', '<td');
        }).join('')}
      </tr>`;

    body.innerHTML = `
      ${legend}
      <div class="table-wrap">
        <table class="data-table cmp-table">
          <thead>${head}</thead>
          <tbody>${rowsHtml}</tbody>
          <tbody>${totalRow}</tbody>
        </table>
      </div>`;

    // ----- Bind expand/collapse -----
    document.querySelectorAll('.cmp-main-row').forEach(tr => {
      tr.addEventListener('click', () => {
        const key = tr.dataset.rowkey;
        const drill = document.querySelector('.cmp-drill[data-rowkey="' + key + '"]');
        const arrow = tr.querySelector('.cmp-arrow');
        if (!drill) return;
        const open = drill.style.display !== 'none';
        drill.style.display = open ? 'none' : '';
        if (arrow) arrow.textContent = open ? '▶' : '▼';
      });
    });
  }

  return {
    dashboard, upload, mapping, payroll, hr, cb, business, finance, mobility,
    management, ai, forecast, anomaly, reports, settings,
    datasets, compare,
    employeeTable, deptTable
  };
})();

  // ---------- Export (CSV / JSON for offline) ----------
  function downloadFile(filename, content, mime='text/plain;charset=utf-8') {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function csvFromObj(arr) {
    if (!arr.length) return '';
    const keys = Object.keys(arr[0]);
    const head = keys.join(',');
    const rows = arr.map(r => keys.map(k => {
      const v = r[k];
      if (v == null) return '';
      const s = String(v).replace(/"/g,'""');
      return /[,"\n]/.test(s) ? `"${s}"` : s;
    }).join(','));
    return '\uFEFF' + head + '\n' + rows.join('\n');
  }

  function setStep(name, state) {

  // Short stable hash for dataset identity (no crypto required, file:// safe)
  async function sha1Short(s) {
    let h1 = 0xdeadbeef ^ 0, h2 = 0x41c6ce57 ^ 0;
    for (let i = 0; i < s.length; i++) {
      const ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36).slice(0, 12);
  }

  async function handleUpload(file) {
    if (!file) return;
    snapshotMock();

    // Validate file type early
    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      toast(lang()==='zh'
        ? '当前离线版仅支持 CSV / TSV 文本格式。请将 Excel 另存为 CSV(UTF-8)后再上传,或点击「生成示例数据」查看效果。'
        : 'This offline build only supports CSV/TSV. Save your Excel as CSV (UTF-8) and try again, or click "Generate Sample".', 'error');
      // reset file input so the same file can be re-selected
      const fi = document.getElementById('fileInput'); if (fi) fi.value = '';
      ['read','detect','map','done'].forEach(s => setStep(s, ''));
      return;
    }

    toast((lang()==='zh'?'开始处理: ':'Processing: ') + file.name);

    // Show steps active
    ['read','detect','map','done'].forEach(s => setStep(s, ''));
    setStep('read','active');

    try {
      const result = await Parser.ingest(file, (stage, progress, msg) => {
        if (stage === 'read')   { setStep('read','active'); }
        if (stage === 'parse')  { setStep('read','done'); setStep('detect','active'); }
        if (stage === 'detect') { setStep('detect','active'); }
        if (stage === 'map')    { setStep('detect','done'); setStep('map','active'); }
        if (stage === 'agg')    { setStep('map','done'); setStep('done','active'); }
        if (stage === 'done')   { setStep('done','done'); }
      });

      if (!result.dataset) throw new Error(lang()==='zh'?'未能解析出有效数据':'Could not parse any data');
      const detectedFields = Object.keys(result.matched).length;
      if (detectedFields === 0) {
        throw new Error(lang()==='zh'
          ? '未识别到任何已知字段。请使用「下载模板」按钮获取标准列名,或点击「生成示例数据」。'
          : 'No known fields detected. Use "Download Template" to get the expected headers, or click "Generate Sample".');
      }

      applyDataset(result.dataset);
      const info = {
        fileName: file.name, fileSize: file.size,
        recordCount: result.recordCount,
        headers: result.headers, headerMap: result.headerMap,
        matched: result.matched,
        detectedFields, totalFields: result.headers.length,
        countries: result.dataset.countryCost.length,
        sample: result.sample,
        preamble: result.preamble,
        meta: result.meta
      };
      DataStore.set(result.dataset, info);

      // ----- Persist to dataset library (IndexedDB) for cross-comparison -----
      // The preamble (Pay Group + 发薪周期 + 展示货币 + 主体) on top of the
      // Workday report is the AUTHORITATIVE identity of this dataset — we use
      // it for naming, deduplication and as the comparison label.
      try {
        if (window.Datasets) {
          const meta = result.meta || {};
          const preamble = result.preamble || {};

          // Build a human-friendly, unique-ish name from preamble
          const pgLabel = preamble.payGroups && preamble.payGroups.length
            ? preamble.payGroups.join(' + ')
            : (meta.payGroup || '');
          const ppLabel = preamble.periods && preamble.periods.length
            ? preamble.periods.join(' + ')
            : (meta.periodRaw || meta.period || '');
          const displayName = (pgLabel || 'Unknown PG') + '  ·  ' + (ppLabel || 'Unknown Period');

          // Stable-ish key for dedup: same Pay Group + same Period => same key
          const keySrc = (pgLabel + '||' + ppLabel).toLowerCase().replace(/\s+/g,' ');
          const stableId = 'ds_' + (await sha1Short(keySrc));

          // Check existing
          const existing = (Datasets.list() || []).find(d => d.id === stableId);
          if (existing) {
            const ok = confirm(lang()==='zh'
              ? `已存在相同 PayGroup + 发薪周期 的数据集:\n\n${displayName}\n\n点「确定」覆盖更新;点「取消」放弃这次上传。`
              : `A dataset with the same Pay Group + Period already exists:\n\n${displayName}\n\nClick OK to OVERWRITE, Cancel to abort.`);
            if (!ok) {
              toast(lang()==='zh'?'已放弃':'Aborted','warn');
              return;
            }
            await Datasets.remove(stableId);
          }

          const entry = {
            id: stableId,
            name: displayName,
            fileName: file.name,
            payGroup:  pgLabel || 'Unknown',
            payGroups: preamble.payGroups || [],
            period:    ppLabel || 'Unknown',
            periods:   preamble.periods   || [],
            periodStart: meta.periodStart || null,
            periodEnd:   meta.periodEnd   || null,
            currency:  preamble.currency  || meta.currency || '',
            entity:    preamble.entity    || meta.entity   || 'Unknown',
            recordCount: result.recordCount,
            uploadedAt: Date.now(),
            records: (result.records || []).slice(0, 50000),
            aggregated: result.dataset
          };
          await Datasets.add(entry);
          toast((lang()==='zh'?'✓ 已按表头标识入库 · ':'✓ Dataset registered · ') + displayName, 'success');
        }
      } catch (perr) {
        console.warn('[Datasets persist failed]', perr);
      }

      // Refresh upload page to show summary; this rebuilds DOM (including dropzone & banner)
      Views.upload();
      injectDataBanner();

      toast((lang()==='zh'?'✓ 解析完成 · 共 ':'✓ Parsed · ') + result.recordCount.toLocaleString() + (lang()==='zh'?' 条记录,数据已应用到所有看板':' records loaded into all dashboards'), 'success');
    } catch (err) {
      console.error('[Upload]', err);
      ['read','detect','map','done'].forEach(s => setStep(s, ''));
      toast((lang()==='zh'?'解析失败: ':'Parse failed: ') + (err.message || err), 'error');
    } finally {
      // ALWAYS reset the file input so re-selecting the same file works
      const fi = document.getElementById('fileInput');
      if (fi) fi.value = '';
    }
  }

  async function exportCompare() {
    if (!window.Datasets || !window.Analytics) return;
    const datasets = await Datasets.getActiveFull();
    if (!datasets || datasets.length === 0) { toast(lang()==='zh'?'没有选中的数据集':'No active datasets','error'); return; }
    const dim = (window.__cmpState && window.__cmpState.dim) || 'country';
    const metric = (window.__cmpState && window.__cmpState.metric) || 'total';
    const merged = Analytics.mergeDatasetsByDim(datasets, dim, metric);
    const lines = [];
    lines.push([dim, ...merged.cols, 'Variance vs Base'].join(','));
    merged.rows.forEach((r, ri) => {
      const baseV = merged.matrix[ri][0] || 0;
      const lastV = merged.matrix[ri][merged.cols.length-1] || 0;
      const dlt = baseV ? ((lastV - baseV)/baseV) : 0;
      lines.push([r, ...merged.matrix[ri].map(v=>v==null?'':Math.round(v)), (dlt*100).toFixed(2)+'%'].join(','));
    });
    downloadFile('compare-' + dim + '-' + metric + '-' + Date.now() + '.csv', '\uFEFF' + lines.join('\n'), 'text/csv;charset=utf-8');
    toast(lang()==='zh'?'对比表已导出':'Comparison exported','success');
  }

  // ============================================================
  // Demo dataset generator — 4 datasets with embedded anomalies
  // for instant exploration of cross-table comparison features
  // ============================================================
  async function loadDemoDatasets() {
    if (!window.Datasets) { toast('Datasets module not ready', 'error'); return; }

    // Each demo dataset = a Pay Group / Period combo
    // Anomaly profile injects realistic business surprises so colors light up
    const demos = [
      { id:'demo_gb_2026_01', pg:'GB Pay Group', per:'01/01/2026 - 01/31/2026 (Monthly)',
        baseFactor:1.00, profile:'baseline',
        countries:[ {code:'GB', share:0.85, hc:120}, {code:'IE', share:0.15, hc:18} ] },
      { id:'demo_de_2026_01', pg:'DE Pay Group', per:'01/01/2026 - 01/31/2026 (Monthly)',
        baseFactor:1.12, profile:'overtime_surge',  // ⚠ 加班暴涨 +35%
        countries:[ {code:'DE', share:0.78, hc:95}, {code:'AT', share:0.12, hc:14}, {code:'CH', share:0.10, hc:11} ] },
      { id:'demo_fr_2026_01', pg:'FR Pay Group', per:'01/01/2026 - 01/31/2026 (Monthly)',
        baseFactor:0.92, profile:'cost_down',  // ↓ 整体下降
        countries:[ {code:'FR', share:0.90, hc:85}, {code:'BE', share:0.10, hc:9} ] },
      { id:'demo_nl_2026_01', pg:'NL Pay Group', per:'01/01/2026 - 01/31/2026 (Monthly)',
        baseFactor:1.30, profile:'mobility_spike',  // 🔴 派遣成本暴涨
        countries:[ {code:'NL', share:0.88, hc:62}, {code:'LU', share:0.12, hc:8} ] }
    ];

    const DEPTS = ['Finance', 'HR', 'IT', 'Operations', 'Sales', 'Logistics', 'Marketing', 'Legal', 'Tax', 'Procurement'];

    function makeDataset(d) {
      const f = d.baseFactor;
      const profile = d.profile;
      // Per-country aggregated rows (matches MOCK.countryCost shape used by analytics)
      const countryCost = d.countries.map(c => {
        const hc = c.hc;
        const baseSalary = 12000 * hc * f;          // 基本工资
        let variable    = 1800 * hc * f;
        let overtime    = 600 * hc * f;
        let mobility    = 900 * hc * f;
        let benefit     = 700 * hc * f;
        let tax         = 2200 * hc * f;
        let employer    = 2400 * hc * f;
        let finance     = 200 * hc * f;
        // ---- Inject anomalies ----
        if (profile === 'overtime_surge')  { overtime *= 1.35; variable *= 1.18; }   // DE
        if (profile === 'cost_down')       { variable *= 0.78; mobility *= 0.55; }   // FR
        if (profile === 'mobility_spike')  { mobility *= 2.4;  benefit  *= 1.20; }   // NL
        const total = (baseSalary + variable + overtime + mobility + benefit + tax + employer + finance) / 1000;
        const meta = (window.MOCK && MOCK.COUNTRIES.find(x => x.code === c.code)) || { cn:c.code, en:c.code, region:'EU', cur:'EUR' };
        return {
          code: c.code, region: meta.region, currency: meta.cur, cn: meta.cn, en: meta.en,
          hc: hc, total: total,
          base:     baseSalary / 1000,
          variable: variable / 1000,
          overtime: overtime / 1000,
          mobility: mobility / 1000,
          benefit:  benefit / 1000,
          tax:      tax / 1000,
          employer: employer / 1000,
          finance:  finance / 1000,
          mom: 0, yoy: 0
        };
      });

      // Per-department aggregated rows
      const totalHc = d.countries.reduce((s,c) => s + c.hc, 0);
      const deptCost = DEPTS.map((name, i) => {
        const share = [0.18, 0.12, 0.20, 0.16, 0.14, 0.08, 0.05, 0.03, 0.02, 0.02][i];
        const dHc = Math.round(totalHc * share);
        let total = (countryCost.reduce((s,c) => s + c.total, 0)) * share;
        // Inject dept anomaly per profile
        if (profile === 'mobility_spike' && name === 'IT') total *= 1.30;
        if (profile === 'overtime_surge' && name === 'Logistics') total *= 1.25;
        return {
          id: name, cn: name, en: name, hc: dHc, total: total,
          base:     total * 0.55,
          variable: total * 0.10,
          benefit:  total * 0.05,
          mobility: total * (profile === 'mobility_spike' ? 0.18 : 0.06),
          tax:      total * 0.10,
          employer: total * 0.10,
          overtime: total * (profile === 'overtime_surge' ? 0.08 : 0.03)
        };
      }).sort((a,b) => b.total - a.total);

      const aggregated = {
        countryCost, deptCost,
        months: ['2026-01'], trend: [{ month:'2026-01', value: countryCost.reduce((s,c)=>s+c.total,0) }],
        anomalies: [], mobility: [], topEmployees: [],
        forecast: [], forecastMonths: ['2026-02']
      };

      return {
        id: d.id,
        name: d.pg + '  ·  2026-01',
        fileName: '__demo__' + d.id + '.csv',
        payGroup: d.pg,
        payGroups: [d.pg],
        period: '2026-01',
        periods: [d.per],
        periodRaw: d.per,
        periodStart: '2026-01-01',
        periodEnd: '2026-01-31',
        currency: 'EUR',
        entity: d.pg.split(' ')[0] + ' Entity',
        recordCount: totalHc,
        uploadedAt: Date.now(),
        records: [],   // detail records not needed for aggregate-only demo
        aggregated: aggregated,
        __isDemo: true
      };
    }

    // Add each one (Datasets.add may auto-set active to last; we override after)
    const ids = [];
    for (const d of demos) {
      const dataset = makeDataset(d);
      // Remove if a previous demo with same id exists
      try { await Datasets.remove(d.id); } catch(e) {}
      await Datasets.add(dataset);
      ids.push(d.id);
    }
    // Activate all 4 at once for instant compare
    Datasets.setActive(ids);

    toast(lang()==='zh'
      ? '✓ 已生成 4 个虚拟数据集 (GB / DE / FR / NL),已全部勾选'
      : '✓ Loaded 4 demo datasets (GB / DE / FR / NL), all selected', 'success');
  }

  // Helper: select all datasets and re-render compare page
  async function selectAllDatasetsAndCompare() {
    if (!window.Datasets) return;
    const list = Datasets.list();
    if (list.length === 0) return;
    Datasets.setActive(list.map(d => d.id));
    navigate('compare');
  }

  function downloadTemplate() {
    const fields = MOCK.FIELDS;
    const head = fields.map(f => f.cn).join(',');
    downloadFile('workday-template.csv', '\uFEFF' + head + '\n', 'text/csv;charset=utf-8');
    toast(lang()==='zh'?'模板已下载,可填入数据后重新上传':'Template downloaded — fill it and re-upload','success');
  }

  function downloadSample() {
    const csv = Parser.generateSampleCSV(200);
    downloadFile('workday-sample-200.csv', csv, 'text/csv;charset=utf-8');
    toast(lang()==='zh'?'已下载 200 行示例数据,可立即上传':'Sample (200 rows) downloaded — upload to test','success');
  }

  function downloadSampleSet() {
    // Three sample files with different Pay Group + same period to demo Compare
    const sets = [
      { payGroup: 'GB Pay Group', period: '01/01/2026 - 01/31/2026 (Monthly)', factor: 1.00, file: 'sample-GB-2026-01.csv' },
      { payGroup: 'DE Pay Group', period: '01/01/2026 - 01/31/2026 (Monthly)', factor: 1.18, file: 'sample-DE-2026-01.csv' },
      { payGroup: 'FR Pay Group', period: '01/01/2026 - 01/31/2026 (Monthly)', factor: 0.92, file: 'sample-FR-2026-01.csv' }
    ];
    sets.forEach((s, i) => {
      const csv = Parser.generateSampleCSV(150, { payGroup: s.payGroup, period: s.period, factor: s.factor });
      // stagger downloads slightly so browsers don't suppress them
      setTimeout(() => downloadFile(s.file, csv, 'text/csv;charset=utf-8'), i * 250);
    });
    toast(lang()==='zh'
      ? '已生成 3 个 PayGroup (GB/DE/FR) 示例文件 — 请依次上传后到「跨表对比」页面查看'
      : '3 sample files (GB/DE/FR Pay Group) downloaded — upload them one by one then open Cross-Compare', 'success');
  }

  function init() {
    I18N.apply();
    renderNav();
    navigate('dashboard');

    // Load saved datasets from IndexedDB (if any)
    if (window.Datasets) {
      Datasets.refresh().then(() => {
        // re-render only if user hasn't navigated away
        const list = Datasets.list();
        if (list.length > 0) {
          toast((lang()==='zh'?'已加载 ':'Loaded ') + list.length + (lang()==='zh'?' 个历史数据集':' saved datasets'), 'success');
        }
      }).catch(e => console.warn('[Datasets.refresh failed]', e));
    }

    document.getElementById('btnLang').addEventListener('click', () => { I18N.toggle(); refresh(); });
    document.getElementById('btnExport').addEventListener('click', exportCurrent);
    document.getElementById('roleFilter').addEventListener('change', e => {
      const map = { management:'management', payroll:'payroll', hr:'hr', cb:'cb', finance:'finance', mobility:'mobility', business:'business' };
      navigate(map[e.target.value] || 'dashboard');
    });
    document.getElementById('periodFilter').addEventListener('change', () => {
      toast(lang()==='zh'?'已切换期间,数据已刷新':'Period changed, data refreshed','success');
      navigate(current);
    });
    document.getElementById('btnMenu').addEventListener('click', () => {
      const sb = document.querySelector('.sidebar');
      sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
    });
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerMask').addEventListener('click', closeDrawer);
    window.addEventListener('resize', () => { if (Views[current]) Views[current](); });
  }

  return {
    init, navigate, refresh, toast,
    drillCountry, drillDept, openEmployee, openAnomaly,
    askAI, exportReport, exportAll,
    handleUpload, downloadTemplate, downloadSample, downloadSampleSet, resetData,
    toggleDatasetActive, setActiveDataset, renameDataset, deleteDataset, clearAllDatasets, exportCompare,
    loadDemoDatasets, selectAllDatasetsAndCompare
  };
})();

document.addEventListener('DOMContentLoaded', App.init); 
</script>
</body></html>
