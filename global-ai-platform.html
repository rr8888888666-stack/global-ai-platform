<!DOCTYPE html>
<!-- JD/Joybuy 全球用工成本智能分析平台 (单文件版) -->
<!-- 100% 离线 - 无后端 - 数据留存浏览器本地 -->
<html lang="zh-CN"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>JD / Joybuy 全球用工成本智能分析平台</title>
<style>
/* ========== JD Workforce Cost Intelligence Platform · Offline Stylesheet ========== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif; color: #1f2937; background: #f4f6fb; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

#app { display: flex; height: 100vh; overflow: hidden; }

/* ========== Sidebar ========== */
.sidebar { width: 248px; background: linear-gradient(180deg,#0f172a 0%, #1e293b 100%); color: #cbd5e1; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 2px 0 12px rgba(0,0,0,.06); }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,.06); }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg,#e60012,#ff4757); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; letter-spacing: .5px; box-shadow: 0 4px 14px rgba(230,0,18,.35); }
.brand-text .brand-title { font-size: 13px; font-weight: 600; color: #f1f5f9; }
.brand-text .brand-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

.nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav::-webkit-scrollbar { width: 6px; } .nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
.nav-group { padding: 12px 12px 6px; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 2px 4px; border-radius: 8px; font-size: 13.5px; color: #cbd5e1; transition: all .18s; cursor: pointer; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: linear-gradient(90deg, rgba(230,0,18,.18), rgba(230,0,18,.04)); color: #fff; box-shadow: inset 3px 0 0 #e60012; }
.nav-item .icon { width: 18px; text-align: center; font-size: 15px; opacity: .9; }
.nav-item .badge { margin-left: auto; background: #ef4444; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 8px; }

.sidebar-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

/* ========== Main ========== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: 60px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 1px 0 rgba(0,0,0,.02); }
.topbar-left { display: flex; align-items: center; gap: 14px; }
.page-title { font-size: 16px; font-weight: 600; color: #111827; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.filter { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748b; }
.filter select { border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; background: #f9fafb; outline: none; }
.filter select:focus { border-color: #e60012; }

.btn { background: #fff; border: 1px solid #e5e7eb; padding: 7px 14px; border-radius: 6px; font-size: 12.5px; color: #374151; transition: all .15s; }
.btn:hover { border-color: #e60012; color: #e60012; }
.btn-primary { background: linear-gradient(135deg,#e60012,#ff3b4a); border-color: transparent; color: #fff; }
.btn-primary:hover { color: #fff; opacity: .92; }
.btn-ghost { background: transparent; border: none; font-size: 18px; color: #64748b; }

.content { flex: 1; overflow-y: auto; padding: 22px 28px; }
.content::-webkit-scrollbar { width: 8px; } .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

/* ========== Page header ========== */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
.page-head h1 { font-size: 22px; font-weight: 700; color: #0f172a; }
.page-head .desc { font-size: 13px; color: #64748b; margin-top: 4px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.tag-red { background: #fee2e2; color: #b91c1c; }
.tag-green { background: #dcfce7; color: #15803d; }
.tag-blue { background: #dbeafe; color: #1d4ed8; }
.tag-amber { background: #fef3c7; color: #b45309; }
.tag-gray { background: #f1f5f9; color: #475569; }

/* ========== KPI ========== */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #eef0f4; transition: all .18s; position: relative; overflow: hidden; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(15,23,42,.06); }
.kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--accent, #e60012); }
.kpi .kpi-label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
.kpi .kpi-value { font-size: 24px; font-weight: 700; color: #0f172a; }
.kpi .kpi-sub { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11.5px; color: #64748b; }
.kpi .kpi-delta.up { color: #dc2626; }
.kpi .kpi-delta.down { color: #16a34a; }
.kpi .kpi-icon { position:absolute; right: 14px; top: 14px; font-size: 22px; opacity: .12; }

/* ========== Card / Charts ========== */
.row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-bottom: 14px; }
.card { background: #fff; border: 1px solid #eef0f4; border-radius: 12px; padding: 16px 18px; transition: box-shadow .18s; }
.card:hover { box-shadow: 0 6px 18px rgba(15,23,42,.04); }
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 6px; height: 6px; border-radius: 50%; background: #e60012; }
.card-tools { display: flex; gap: 6px; }
.card-tools .mini { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid #e5e7eb; background: #fff; color: #64748b; cursor: pointer; }
.card-tools .mini.active { background: #e60012; color: #fff; border-color: #e60012; }
.col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; } .col-6 { grid-column: span 6; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
@media (max-width: 1100px) { .col-3{grid-column:span 6} .col-4{grid-column:span 6} .col-6{grid-column:span 12} .col-8{grid-column:span 12} }

.chart { width: 100%; height: 280px; }
.chart-sm { height: 200px; }
.chart-lg { height: 360px; }

/* ========== Table ========== */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl thead th { text-align: left; padding: 10px 12px; background: #f8fafc; color: #475569; font-weight: 600; border-bottom: 1px solid #eef0f4; position: sticky; top: 0; }
.tbl tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
.tbl tbody tr:hover { background: #fafbff; cursor: pointer; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .bar-cell { position: relative; }
.tbl .bar-bg { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(230,0,18,.12), rgba(230,0,18,.02)); }
.tbl .bar-text { position: relative; }

/* ========== Upload ========== */
.dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 48px; text-align: center; background: #fff; transition: all .2s; cursor: pointer; }
.dropzone:hover, .dropzone.drag { border-color: #e60012; background: #fff5f5; }
.dropzone .big-icon { font-size: 42px; color: #cbd5e1; margin-bottom: 10px; }
.dropzone:hover .big-icon { color: #e60012; }
.dropzone h3 { font-size: 16px; color: #0f172a; margin-bottom: 4px; }
.dropzone p { font-size: 12.5px; color: #64748b; }

.steps { display: flex; gap: 0; margin: 22px 0; }
.step { flex: 1; padding: 14px 16px; background: #fff; border: 1px solid #eef0f4; position: relative; font-size: 12.5px; color: #64748b; display: flex; align-items: center; gap: 10px; }
.step:first-child { border-radius: 8px 0 0 8px; } .step:last-child { border-radius: 0 8px 8px 0; }
.step .step-no { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.step.done { background: #f0fdf4; color: #166534; } .step.done .step-no { background: #16a34a; }
.step.active { background: #fff5f5; color: #b91c1c; border-color: #fecaca; } .step.active .step-no { background: #e60012; }

/* ========== AI Insight ========== */
.ai-panel { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: #fff; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
.ai-panel::after { content: "AI"; position: absolute; right: -10px; bottom: -30px; font-size: 120px; font-weight: 800; color: rgba(255,255,255,.04); }
.ai-panel .ai-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.ai-panel .ai-title .ai-badge { background: linear-gradient(90deg,#06b6d4,#8b5cf6); padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
.ai-insight { background: rgba(255,255,255,.06); border-left: 3px solid #06b6d4; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; line-height: 1.6; }
.ai-insight.warn { border-left-color: #f59e0b; } .ai-insight.danger { border-left-color: #ef4444; } .ai-insight.good { border-left-color: #10b981; }
.ai-insight .tag-mini { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(6,182,212,.25); margin-right: 6px; font-weight: 600; }

/* ========== Mapping engine ========== */
.mapping { display: grid; grid-template-columns: 1fr 50px 1fr 50px 1fr; gap: 0; align-items: stretch; }
.layer { background: #fff; border: 1px solid #eef0f4; border-radius: 8px; padding: 10px; min-height: 320px; }
.layer h4 { font-size: 13px; padding: 6px 8px; margin-bottom: 8px; border-radius: 4px; }
.layer-1 h4 { background: #fef3c7; color: #b45309; }
.layer-2 h4 { background: #dbeafe; color: #1d4ed8; }
.layer-3 h4 { background: #dcfce7; color: #15803d; }
.layer-item { padding: 6px 10px; background: #f8fafc; border-radius: 4px; font-size: 12px; margin-bottom: 4px; color: #334155; cursor: pointer; transition: all .15s; border-left: 2px solid transparent; }
.layer-item:hover { background: #fff5f5; border-left-color: #e60012; color: #b91c1c; }
.arrow { display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 18px; }

/* ========== Heatmap ========== */
.heatmap { display: grid; gap: 2px; }
.hm-cell { padding: 8px 6px; text-align: center; font-size: 11px; color: #fff; border-radius: 3px; font-weight: 500; cursor: pointer; transition: transform .12s; }
.hm-cell:hover { transform: scale(1.06); z-index: 2; box-shadow: 0 4px 12px rgba(0,0,0,.12); }

/* ========== Drawer ========== */
.drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 90; display: none; }
.drawer-mask.show { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; background: #fff; z-index: 100; transform: translateX(100%); transition: transform .25s; box-shadow: -8px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 16px 20px; border-bottom: 1px solid #eef0f4; display: flex; justify-content: space-between; align-items: center; }
.drawer-head h3 { font-size: 16px; font-weight: 600; }
.drawer-head .close { background: transparent; border: none; font-size: 20px; color: #94a3b8; }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }

/* ========== Misc ========== */
.health-ring { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 200px; }
.health-num { font-size: 48px; font-weight: 800; color: #16a34a; }
.health-label { font-size: 12px; color: #64748b; margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: #64748b; margin-top: 8px; }
.legend .lg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.toast { position: fixed; top: 20px; right: 20px; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 200; animation: slideIn .25s; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.toast.success { background: linear-gradient(135deg,#16a34a,#15803d); }
.toast.warn { background: linear-gradient(135deg,#f59e0b,#d97706); }
.toast.error { background: linear-gradient(135deg,#dc2626,#b91c1c); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.skeleton { background: linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
@keyframes shimmer { 0%{background-position: 200% 0;} 100% {background-position: -200% 0;} }

.list-clean { list-style: none; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }
.text-muted { color: #64748b; } .text-sm { font-size: 12px; } .text-lg { font-size: 16px; font-weight: 600; }
.text-right { text-align: right; }

/* ========== Tooltip ========== */
.chart-tip { position: absolute; background: rgba(15,23,42,.92); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 50; box-shadow: 0 6px 16px rgba(0,0,0,.18); white-space: nowrap; }
.chart-tip strong { color: #fbbf24; font-size: 13px; }

/* ========== Settings ========== */
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
.setting-row:last-child { border: none; }
.setting-name { font-size: 13.5px; color: #0f172a; font-weight: 500; }
.setting-desc { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
.switch { width: 38px; height: 20px; background: #cbd5e1; border-radius: 10px; position: relative; cursor: pointer; transition: .2s; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .2s; }
.switch.on { background: #16a34a; } .switch.on::after { left: 20px; }

/* ========== Forecast ========== */
.forecast-band { fill: rgba(230,0,18,.08); }
.forecast-line { stroke: #e60012; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }

/* ========== Print ========== */
@media print { .sidebar, .topbar { display: none; } .content { padding: 0; } }
/* ========== Data source banner ========== */
.data-banner { display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:12.5px; }
.data-banner.demo { background: linear-gradient(90deg,#fef3c7,#fffbeb); border:1px solid #fde68a; color:#92400e; }
.data-banner.live { background: linear-gradient(90deg,#dcfce7,#f0fdf4); border:1px solid #86efac; color:#14532d; }
.data-banner b { font-weight:700; }
.data-banner .data-banner-tag { padding:2px 8px; border-radius:4px; font-weight:700; font-size:11px; letter-spacing:.5px; }
.data-banner.demo .data-banner-tag { background:#f59e0b; color:#fff; }
.data-banner.live .data-banner-tag { background:#16a34a; color:#fff; }
.data-banner .right { margin-left:auto; }
.data-banner button { background:transparent; border:1px solid currentColor; padding:4px 10px; border-radius:4px; font-size:11.5px; cursor:pointer; color:inherit; }
.data-banner button:hover { background: rgba(0,0,0,.05); }

/* ========== Dataset Library ========== */
.ds-list { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ds-card { background:#fff; border:1px solid #eef0f4; border-radius:10px; padding:14px 16px; transition: all .18s; cursor:pointer; position:relative; }
.ds-card:hover { box-shadow: 0 8px 18px rgba(15,23,42,.06); border-color:#e60012; }
.ds-card.selected { border-color:#e60012; background: linear-gradient(135deg,#fff5f5,#fff); box-shadow: 0 0 0 2px rgba(230,0,18,.15); }
.ds-card .ds-name { font-size:14px; font-weight:600; color:#0f172a; margin-bottom:6px; padding-right:60px; word-break:break-word; }
.ds-card .ds-meta { font-size:11.5px; color:#64748b; line-height:1.7; }
.ds-card .ds-meta b { color:#334155; }
.ds-card .ds-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px; }
.ds-card .ds-actions { position:absolute; top:10px; right:38px; display:flex; gap:4px; }
.ds-card .ds-actions button { background:transparent; border:none; font-size:13px; color:#94a3b8; cursor:pointer; padding:3px 6px; border-radius:4px; line-height:1; }
.ds-card .ds-actions button:hover { background:#fee2e2; color:#dc2626; }
.ds-card .ds-check { position:absolute; top:14px; right:14px; width:18px; height:18px; border-radius:4px; border:2px solid #cbd5e1; display:flex; align-items:center; justify-content:center; background:#fff; font-size:11px; font-weight:700; }
.ds-card.selected .ds-check { background:#e60012; border-color:#e60012; color:#fff; }
.ds-card.selected .ds-check::before { content:'✓'; }

/* ========== Compare table — high-visibility delta colors ========== */
/* 5-tier color scale: 🔴 danger / 🟠 up / ⚪ flat / 🔵 down / 🟢 warn-down */
.cmp-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.cmp-table thead th {
  background: linear-gradient(180deg,#fff,#f8fafc);
  border-bottom: 2px solid #e2e8f0;
  padding: 10px 12px; text-align: left; font-weight: 700; color:#1e293b;
  position: sticky; top: 0; z-index: 2;
}
.cmp-table tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.cmp-table tbody tr:hover td { background: rgba(99,102,241,0.04); }
.cmp-table tr.row-total td { background:#f8fafc; border-top:2px solid #cbd5e1; font-weight:700; }

/* Cell value + delta layout */
.cmp-table td .cmp-val { font-size: 13.5px; font-weight: 600; color:#0f172a; line-height: 1.2; }
.cmp-table td .cmp-delta {
  display:inline-flex; align-items:center; gap:3px;
  margin-top:4px; padding:3px 8px; border-radius:12px;
  font-size:11.5px; font-weight:700; line-height:1;
  letter-spacing:.2px;
  background:#f1f5f9; color:#475569;
  border:1px solid transparent;
}
.cmp-table td .cmp-delta .arrow { font-size: 12px; }

/* 5 levels of variance — clearly distinguishable */
.cmp-cell-flat   { /* 平稳: 灰底 */ background: #fbfbfd; }
.cmp-cell-flat   .cmp-delta { background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }

.cmp-cell-down   { /* 轻微下降(成本下降是好事): 浅蓝 */ background: rgba(59,130,246,.05); }
.cmp-cell-down   .cmp-delta { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }

.cmp-cell-up     { /* 轻微上升: 浅橙 */ background: rgba(249,115,22,.06); }
.cmp-cell-up     .cmp-delta { background:#fed7aa; color:#9a3412; border-color:#fb923c; }

.cmp-cell-warn   { /* 大幅下降(异常下降也要提醒): 黄底 */ background: rgba(245,158,11,.13); }
.cmp-cell-warn   .cmp-delta { background:#fef3c7; color:#854d0e; border-color:#facc15; }

.cmp-cell-danger { /* 大幅上升(成本暴涨): 深红警示 */
  background: rgba(239,68,68,.18);
  box-shadow: inset 3px 0 0 0 #dc2626;
}
.cmp-cell-danger .cmp-val { color:#7f1d1d; font-weight:800; }
.cmp-cell-danger .cmp-delta { background:#dc2626; color:#fff; border-color:#b91c1c;
  box-shadow: 0 1px 3px rgba(220,38,38,.3); }

/* Animated pulse for danger cells (subtle attention-grabber) */
@keyframes cmpPulse {
  0%, 100% { box-shadow: inset 3px 0 0 0 #dc2626, 0 0 0 0 rgba(220,38,38,0); }
  50%      { box-shadow: inset 3px 0 0 0 #dc2626, 0 0 0 4px rgba(220,38,38,0.08); }
}
.cmp-cell-danger { animation: cmpPulse 2.4s ease-in-out infinite; }

/* Toolbar */
.compare-toolbar {
  background:#fff; border:1px solid #e2e8f0; border-radius:10px;
  padding:14px 16px; margin-bottom:14px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}

  // 12-month trend (CNY thousand)
  const months = [];

  const trend = months.map((m,i) => {

  // Anomalies
  const anomalies = [

    { id:'A005', metricKey:'hc',       countryCode:'US', deptId:'D03', deltaMoM: 0.12,  severity:'low',   cn:'美国技术线 HC 持续增长', en:'US Tech headcount keeps growing' },
    { id:'A006', metricKey:'tax',      countryCode:'JP', deptId:'D01', deltaMoM: 0.21,  severity:'medium',cn:'日本国际业务个税异常上升', en:'Japan International Business IIT abnormal rise' },
    { id:'A007', metricKey:'concentration', countryCode:'CN', deptId:'D01', value:0.61, severity:'high',  cn:'Top3 部门集中度 61%,处于高风险区间', en:'Top-3 department concentration 61%, high risk' },
    { id:'A008', metricKey:'overtime', countryCode:'CN', deptId:'D06', deltaYoY: 0.42,  severity:'medium',cn:'中国客服加班同比 +42%', en:'CN Customer Service overtime +42% YoY' }
  ];

  // Forecast (next 6 months) with confidence band
  const forecastMonths = [];
  for (let i=1;i<=6;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    forecastMonths.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  const lastVal = trend[trend.length-1].total;
  const forecast = forecastMonths.map((m,i) => {
    const v = lastVal*(1+ 0.018*(i+1)) + (Math.random()-0.5)*1500;
    return { month: m, value: Math.round(v), lower: Math.round(v*0.94), upper: Math.round(v*1.06) };

  // Mobility cost detail
  const mobility = [
    { country:'GB', cn:'英国',   en:'UK',          hc: 38, housing: 1980, living: 720, family: 410, taxEqual: 880, total: 3990 },
    { country:'AE', cn:'阿联酋', en:'UAE',         hc: 22, housing: 980,  living: 440, family: 210, taxEqual: 380, total: 2010 },

    { country:'JP', cn:'日本',  en:'Japan',        hc: 18, housing: 880,  living: 380, family: 190, taxEqual: 320, total: 1770 },
    { country:'US', cn:'美国',  en:'USA',          hc: 31, housing: 1610, living: 590, family: 320, taxEqual: 580, total: 3100 },
    { country:'DE', cn:'德国',  en:'Germany',      hc: 19, housing: 740,  living: 320, family: 180, taxEqual: 240, total: 1480 },
    { country:'NL', cn:'荷兰',  en:'Netherlands',  hc: 14, housing: 580,  living: 240, family: 140, taxEqual: 180, total: 1140 },
    { country:'PL', cn:'波兰',  en:'Poland',       hc: 12, housing: 320,  living: 180, family: 90,  taxEqual: 110, total: 700  }
  ];

  // Top employees (drill-down sample)
  const topEmployees = Array.from({length: 30}, (_, i) => ({

    country: COUNTRIES[i%COUNTRIES.length].code,

  return {
    COUNTRIES, DEPTS, FIELDS,

    months, forecastMonths, mobility, topEmployees
  };
})();

/* ========== Lightweight SVG Chart Library (zero dependency) ========== */
window.Chart = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  const PALETTE = ['#e60012','#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#f43f5e','#22c55e','#0ea5e9'];

  function el(tag, attrs={}, text){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(n){
    if (n == null) return '';
    if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(2)+'亿';
    if (Math.abs(n) >= 1e4) return (n/1e4).toFixed(1)+'万';
    if (Math.abs(n) >= 1000) return (n/1000).toFixed(1)+'k';
    return Math.round(n).toString();
  }
  function clear(host){ while (host.firstChild) host.removeChild(host.firstChild); }
  function tip(){
    let t = document.querySelector('.chart-tip');
    if (!t) { t = document.createElement('div'); t.className='chart-tip'; document.body.appendChild(t); }
    return t;
  }
  function showTip(html, x, y){ const t = tip(); t.innerHTML = html; t.style.display='block'; t.style.left=(x+10)+'px'; t.style.top=(y+10)+'px'; }
  function hideTip(){ const t = document.querySelector('.chart-tip'); if (t) t.style.display='none'; }

  function setupSVG(host){
    clear(host);
    const w = host.clientWidth || 600;
    const h = host.clientHeight || 280;
    const svg = el('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
    host.appendChild(svg);
    return { svg, w, h };
  }

  // ====== Bar (vertical, multi-series stacked optional) ======
  function bar(host, opts) {
    const { svg, w, h } = setupSVG(host);
    const data = opts.data; // [{name, value} or {name, values:[]}]
    const stacked = !!opts.stacked;
    const series = opts.series || [{key:'value', name:opts.seriesName||'Value'}];
    const padding = { l: 50, r: 12, t: 18, b: 38 };
    const cw = w - padding.l - padding.r;
    const ch = h - padding.t - padding.b;
    const max = Math.max(...data.map(d => stacked
      ? series.reduce((s,k)=>s+(d[k.key]||0),0)
      : Math.max(...series.map(k => d[k.key]||0))
    )) * 1.12 || 1;

    // grid
    for (let i=0;i<=4;i++){
      const y = padding.t + ch*i/4;
      svg.appendChild(el('line',{x1:padding.l,y1:y,x2:w-padding.r,y2:y, stroke:'#f1f5f9'}));
      svg.appendChild(el('text',{x:padding.l-6,y:y+4, 'text-anchor':'end', fill:'#94a3b8','font-size':10}, fmt(max*(1-i/4))));
    }

    const bw = cw / data.length * 0.62;
    const gap = cw / data.length;
    data.forEach((d, i) => {
      const x = padding.l + gap*i + (gap-bw)/2;
      let yCursor = padding.t + ch;
      series.forEach((s, si) => {
        const v = d[s.key] || 0;
        const bh = (v/max) * ch;
        const rect = el('rect', { x, y: yCursor - bh, width: bw, height: bh, fill: PALETTE[si%PALETTE.length], rx: 2 });
        rect.style.cursor='pointer';
        rect.addEventListener('mousemove',e=>{
          showTip(`<strong>${d.name}</strong><br/>${s.name}: ${fmt(v)}`, e.pageX, e.pageY);
        });
        rect.addEventListener('mouseleave',hideTip);
        if (opts.onClick) rect.addEventListener('click', () => opts.onClick(d, s));
        svg.appendChild(rect);
        if (stacked) yCursor -= bh; else if (si === series.length-1) {} 
      });
      svg.appendChild(el('text',{x:x+bw/2,y:h-padding.b+14,'text-anchor':'middle',fill:'#64748b','font-size':10}, d.name));
    });
    return svg;
  }

  // ====== Horizontal Bar ======
  function hbar(host, opts){
    const { svg, w, h } = setupSVG(host);
    const data = opts.data;
    const padding = { l: 110, r: 50, t: 8, b: 14 };
    const cw = w - padding.l - padding.r;
    const ch = h - padding.t - padding.b;
    const max = Math.max(...data.map(d => d.value)) * 1.05 || 1;
    const rowH = ch / data.length;
    data.forEach((d, i) => {
      const y = padding.t + rowH*i + 4;
      const bh = rowH - 8;
      const bw = (d.value/max) * cw;
      svg.appendChild(el('text',{x:padding.l-8,y:y+bh/2+4,'text-anchor':'end',fill:'#475569','font-size':11}, d.name));
      const rect = el('rect',{x:padding.l, y, width:bw, height:bh, fill: d.color || PALETTE[i%PALETTE.length], rx:2});
      rect.style.cursor='pointer';
      rect.addEventListener('mousemove', e => showTip(`<strong>${d.name}</strong><br/>${fmt(d.value)}`, e.pageX, e.pageY));
      rect.addEventListener('mouseleave', hideTip);
      if (opts.onClick) rect.addEventListener('click', () => opts.onClick(d));
      svg.appendChild(rect);
      svg.appendChild(el('text',{x:padding.l+bw+5, y:y+bh/2+4, fill:'#0f172a','font-size':11,'font-weight':600}, fmt(d.value)));
    });
    return svg;
  }

  // ====== Line / Area / Forecast ======
  function line(host, opts) {
    const { svg, w, h } = setupSVG(host);
    const labels = opts.labels;
    const series = opts.series; // [{name,data,color,dashed}]
    const padding = { l: 50, r: 16, t: 18, b: 30 };
    const cw = w - padding.l - padding.r;
    const ch = h - padding.t - padding.b;
    let allVals = [];
    series.forEach(s => allVals.push(...s.data.filter(v => v!=null)));
    if (opts.band) allVals.push(...opts.band.upper, ...opts.band.lower);
    const min = Math.min(...allVals) * 0.92;
    const max = Math.max(...allVals) * 1.08;

    for (let i=0;i<=4;i++){
      const y = padding.t + ch*i/4;
      svg.appendChild(el('line',{x1:padding.l,y1:y,x2:w-padding.r,y2:y, stroke:'#f1f5f9'}));
      svg.appendChild(el('text',{x:padding.l-6,y:y+4,'text-anchor':'end',fill:'#94a3b8','font-size':10}, fmt(max - (max-min)*i/4)));
    }
    const xStep = cw / Math.max(1, labels.length-1);
    labels.forEach((lb,i) => {
      if (i % Math.ceil(labels.length/8) === 0 || i===labels.length-1)
        svg.appendChild(el('text',{x:padding.l+xStep*i,y:h-padding.b+14,'text-anchor':'middle',fill:'#64748b','font-size':10}, lb));
    });

    if (opts.band){
      let pts = '';
      opts.band.upper.forEach((v,i) => { pts += `${padding.l+xStep*i},${padding.t + ch*(1-(v-min)/(max-min))} `; });
      for (let i = opts.band.lower.length-1; i>=0; i--) { const v = opts.band.lower[i]; pts += `${padding.l+xStep*i},${padding.t + ch*(1-(v-min)/(max-min))} `; }
      svg.appendChild(el('polygon',{points:pts, class:'forecast-band'}));
    }

    series.forEach((s, si) => {
      const color = s.color || PALETTE[si%PALETTE.length];
      let path = '';
      s.data.forEach((v, i) => {
        if (v == null) return;
        const x = padding.l + xStep*i;
        const y = padding.t + ch*(1-(v-min)/(max-min));
        path += (path ? 'L' : 'M') + x + ',' + y + ' ';
      });
      svg.appendChild(el('path',{d:path, stroke:color, 'stroke-width':2, fill:'none', 'stroke-dasharray': s.dashed ? '4 4' : ''}));
      s.data.forEach((v,i) => {
        if (v == null) return;
        const x = padding.l + xStep*i;
        const y = padding.t + ch*(1-(v-min)/(max-min));
        const c = el('circle',{cx:x,cy:y,r:3.2,fill:'#fff',stroke:color,'stroke-width':2});
        c.style.cursor='pointer';
        c.addEventListener('mousemove',e=>showTip(`<strong>${labels[i]}</strong><br/>${s.name}: ${fmt(v)}`, e.pageX, e.pageY));
        c.addEventListener('mouseleave',hideTip);
        svg.appendChild(c);
      });
    });

    if (opts.legend !== false) {
      let lx = padding.l;
      series.forEach((s, si) => {
        const color = s.color || PALETTE[si%PALETTE.length];
        const g = el('g',{});
        g.appendChild(el('rect',{x:lx,y:2,width:10,height:10,fill:color,rx:2}));
        g.appendChild(el('text',{x:lx+14,y:11,fill:'#475569','font-size':11}, s.name));
        svg.appendChild(g);
        lx += 14 + (s.name.length*7) + 16;
      });
    }
    return svg;
  }

  // ====== Pie / Donut ======
  function donut(host, opts){
    const { svg, w, h } = setupSVG(host);
    const data = opts.data;
    const total = data.reduce((s,d)=>s+d.value, 0) || 1;
    const cx = w/2, cy = h/2 - 6;
    const r = Math.min(w,h)/2 - 28;
    const r2 = r * 0.62;
    let acc = 0;
    data.forEach((d, i) => {
      const a0 = acc/total * Math.PI*2 - Math.PI/2;
      const a1 = (acc+d.value)/total * Math.PI*2 - Math.PI/2;
      acc += d.value;
      const large = (a1-a0) > Math.PI ? 1 : 0;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const x2=cx+r2*Math.cos(a1),y2=cy+r2*Math.sin(a1);
      const x3=cx+r2*Math.cos(a0),y3=cy+r2*Math.sin(a0);
      const path = `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r2},${r2} 0 ${large} 0 ${x3},${y3} Z`;
      const p = el('path',{d:path, fill: d.color || PALETTE[i%PALETTE.length]});
      p.style.cursor='pointer';
      p.addEventListener('mousemove', e => showTip(`<strong>${d.name}</strong><br/>${fmt(d.value)} (${(d.value/total*100).toFixed(1)}%)`, e.pageX, e.pageY));
      p.addEventListener('mouseleave', hideTip);
      if (opts.onClick) p.addEventListener('click', () => opts.onClick(d));
      svg.appendChild(p);
    });
    if (opts.center){
      svg.appendChild(el('text',{x:cx,y:cy-2,'text-anchor':'middle',fill:'#0f172a','font-size':18,'font-weight':700}, opts.center.title || fmt(total)));
      svg.appendChild(el('text',{x:cx,y:cy+16,'text-anchor':'middle',fill:'#94a3b8','font-size':11}, opts.center.sub || ''));
    }
    return svg;
  }

  // ====== Heatmap ======
  function heatmap(host, opts){
    const rows = opts.rows;     // ['CN','US',...]
    const cols = opts.cols;     // ['Base','Bonus','Tax',...]
    const matrix = opts.matrix; // matrix[r][c] = value
    const max = Math.max(...matrix.flat()) || 1;
    clear(host);
    const grid = document.createElement('div');
    grid.className='heatmap';
    grid.style.gridTemplateColumns = `90px repeat(${cols.length}, minmax(0,1fr))`;
    grid.appendChild(document.createElement('div'));
    cols.forEach(c => {
      const h = document.createElement('div');
  h.style.cssText='font-size:10.5px;color:#64748b;text-align:center;padding:6px 4px;';
      h.textContent = c;
      grid.appendChild(h);
    });
    rows.forEach((r, ri) => {
      const lab = document.createElement('div');
      lab.style.cssText='font-size:11px;color:#475569;display:flex;align-items:center;padding:4px 8px;';
      lab.textContent = r;
      grid.appendChild(lab);
      cols.forEach((_, ci) => {
        const v = matrix[ri][ci];
        const intensity = v / max;
        const color = `rgba(230,0,18,${0.08 + intensity*0.85})`;
        const cell = document.createElement('div');
        cell.className = 'hm-cell';
        cell.style.background = color;
        cell.style.color = intensity > 0.45 ? '#fff' : '#0f172a';
        cell.textContent = fmt(v);
        cell.addEventListener('mousemove', e => showTip(`<strong>${r} · ${cols[ci]}</strong><br/>${fmt(v)}`, e.pageX, e.pageY));
        cell.addEventListener('mouseleave', hideTip);
        if (opts.onClick) cell.addEventListener('click', () => opts.onClick(r, cols[ci], v));
        grid.appendChild(cell);
      });
    });
    host.appendChild(grid);
  }

  // ====== Gauge ======
  function gauge(host, opts){
    const { svg, w, h } = setupSVG(host);
    const value = opts.value, max = opts.max || 100;
    const cx = w/2, cy = h/2 + 16;
    const r = Math.min(w,h)/2 - 18;
    const start = Math.PI*0.85, end = Math.PI*2.15;
    function arc(a0,a1,color,sw){
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const large = (a1-a0)>Math.PI?1:0;
      svg.appendChild(el('path',{d:`M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}`,stroke:color,'stroke-width':sw,fill:'none','stroke-linecap':'round'}));
    }
    arc(start, end, '#f1f5f9', 14);
    const ratio = Math.min(1, value/max);
    const a1 = start + (end-start)*ratio;
    const color = ratio>0.85? '#16a34a' : ratio>0.6 ? '#3b82f6' : ratio>0.4 ? '#f59e0b' : '#ef4444';
    arc(start, a1, color, 14);
    svg.appendChild(el('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':32,'font-weight':800, fill:color}, value));
    svg.appendChild(el('text',{x:cx,y:cy+24,'text-anchor':'middle','font-size':11, fill:'#94a3b8'}, opts.label || ''));
    return svg;
  }

  // ====== Stacked Area ======
  function area(host, opts){
    const { svg, w, h } = setupSVG(host);
    const labels = opts.labels;
    const series = opts.series;
    const padding = { l: 50, r: 16, t: 16, b: 30 };
    const cw = w - padding.l - padding.r, ch = h - padding.t - padding.b;
    const stacks = labels.map((_,i) => series.reduce((s,sr)=>s+sr.data[i],0));
    const max = Math.max(...stacks) * 1.05 || 1;
    for (let i=0;i<=4;i++){
      const y = padding.t + ch*i/4;
      svg.appendChild(el('line',{x1:padding.l,y1:y,x2:w-padding.r,y2:y,stroke:'#f1f5f9'}));
      svg.appendChild(el('text',{x:padding.l-6,y:y+4,'text-anchor':'end',fill:'#94a3b8','font-size':10}, fmt(max*(1-i/4))));
    }
    const xStep = cw / Math.max(1,labels.length-1);
    labels.forEach((lb,i) => {
      if (i % Math.ceil(labels.length/8)===0 || i===labels.length-1)
        svg.appendChild(el('text',{x:padding.l+xStep*i,y:h-padding.b+14,'text-anchor':'middle',fill:'#64748b','font-size':10}, lb));
    });
    const cum = labels.map(()=>0);
    series.forEach((s, si) => {
      const color = s.color || PALETTE[si%PALETTE.length];
      let topPts = '', botPts = '';
      labels.forEach((_,i) => {
        const yBot = padding.t + ch*(1 - cum[i]/max);
        cum[i] += s.data[i];
        const yTop = padding.t + ch*(1 - cum[i]/max);
        topPts += `${padding.l+xStep*i},${yTop} `;
        botPts = `${padding.l+xStep*i},${yBot} ` + botPts;
      });
      svg.appendChild(el('polygon',{points: topPts + botPts, fill: color, opacity: 0.75}));
    });
    return svg;
  }

  return { bar, hbar, line, donut, heatmap, gauge, area, fmt, PALETTE };
})();

/* ========== 3-Layer Cost Mapping Engine ==========
   Layer 1: Raw Payroll Items (Workday columns)
   Layer 2: Business Cost Categories (management-oriented)
   Layer 3: Finance / GL Categories
================================================== */
window.Mapping = (function () {
  // Layer 1 -> Layer 2
  const L1_TO_L2 = {
    // Fixed Labor Cost
    baseSalary:'fixedLabor', postAllow:'fixedLabor', tenureAllow:'fixedLabor', seniorityAllow:'fixedLabor',
    // Variable Incentive
    perfPay:'variableIncentive', perfBonus:'variableIncentive', yearBonus:'variableIncentive',
    annualContribBonus:'variableIncentive', referralBonus:'variableIncentive', companyBonus:'variableIncentive',
    // Overtime Cost
    overtimePay:'overtimeCost', holidayPay:'overtimeCost', leaveCash:'overtimeCost',
    // Mobility Cost
    expatIncentive:'mobilityCost', housingAllow:'mobilityCost', livingAllow:'mobilityCost',
    familyAllow:'mobilityCost', taxEqual:'mobilityCost',
    // Benefits Cost
    mealAllow:'benefitsCost', transportAllow:'benefitsCost', commAllow:'benefitsCost',
    nightShiftAllow:'benefitsCost', otherBenefit:'benefitsCost',
    // Tax Cost
    iit:'taxCost', stockTax:'taxCost', hypoTax:'taxCost',
    // Employer Contribution
    siPersonal:'employerContribution', employerStat:'employerContribution', employerSupp:'employerContribution',
    // Finance Cost
    serviceFee:'financeCost', vat:'financeCost', thirdPartyReimb:'financeCost', deposit:'financeCost'
  };
  // Layer 2 -> Layer 3 (Finance / GL)
  const L2_TO_L3 = {
    fixedLabor:'salary',
    variableIncentive:'bonus',
    overtimeCost:'salary',
    mobilityCost:'mobility',
    benefitsCost:'benefits',
    taxCost:'tax',
    employerContribution:'benefits',
    financeCost:'serviceFee'
  };

  const L2_DEF = {
    fixedLabor:        { cn:'固定薪酬', en:'Fixed Labor Cost' },
    variableIncentive: { cn:'变动激励', en:'Variable Incentive' },
    overtimeCost:      { cn:'加班/假期', en:'Overtime / Leave' },
    mobilityCost:      { cn:'派遣成本', en:'Mobility Cost' },
    benefitsCost:      { cn:'福利成本', en:'Benefits Cost' },
    taxCost:           { cn:'税务成本', en:'Tax Cost' },
    employerContribution:{cn:'雇主缴款',en:'Employer Contribution'},
    financeCost:       { cn:'财务费用', en:'Finance Cost' }
  };

  const L3_DEF = {
    salary:    { cn:'工资 (Salary)', en:'Salary' },
    bonus:     { cn:'奖金 (Bonus)',  en:'Bonus' },
    mobility:  { cn:'派遣 (Mobility)',en:'Mobility' },
    benefits:  { cn:'福利 (Benefits)',en:'Benefits' },
    tax:       { cn:'税 (Tax)',      en:'Tax' },
    serviceFee:{ cn:'服务费 (Service Fee)', en:'Service Fee' }
  };

  // Auto-detect Workday columns by header (zh/en aliases)
  const HEADER_ALIASES = {
    // ----- Fixed labor -----
    baseSalary:     ['基本工资','base salary','base pay','base'],
    postAllow:      ['岗位津贴','post allowance','position allowance'],
    tenureAllow:    ['工龄补贴','tenure allowance','tenure'],
    seniorityAllow: ['司龄补贴','seniority allowance','seniority'],
    // ----- Variable -----
    perfPay:    ['绩效工资','performance pay','perf pay'],
    perfBonus:  ['绩效奖励','perf bonus','performance bonus'],
    yearBonus:  ['年终奖实发','年终奖','year-end bonus','year end bonus','annual bonus','ytb'],
    annualContribBonus: ['年度贡献奖实发','annual contribution bonus','contribution bonus'],
    referralBonus: ['推荐奖','referral bonus','referral'],
    companyBonus:  ['签约奖','sign-on bonus','sign on bonus','其它奖金','other bonus'],
    // ----- Overtime / leave -----
    overtimePay:['日常加班费','加班费','overtime pay','overtime'],
    holidayPay: ['假期工资','holiday pay'],
    leaveCash:  ['年假折现','其他假期折现','leave cash','annual leave cash','holiday cash'],
    // ----- Mobility -----
    expatIncentive: ['外派激励','expat incentive','assignment incentive'],
    housingAllow:   ['住房津贴','住房补贴','housing allowance','housing'],
    livingAllow:    ['生活津贴','living allowance','living'],
    familyAllow:    ['家属陪同津贴','family allowance','family','dependant allowance'],
    taxEqual:       ['补税差成本','tax equalization','tax equal','hypotax differential'],
    // ----- Benefits -----
    mealAllow:       ['餐补(本地)','餐补','meal allowance','meal'],
    transportAllow:  ['交通补贴(本地)','交通补贴(外派)','交通补贴','transport allowance','transportation'],
    commAllow:       ['通勤补贴(本地)','通勤补贴','commuting allowance','commute'],
    nightShiftAllow: ['夜班补贴','night shift allowance','night shift'],
    otherBenefit:    ['其他福利补贴','其他员工薪酬','other benefit','other welfare'],
    // ----- Tax -----
    iit:      ['个税','iit','individual income tax','income tax'],
    stockTax: ['股票计税','stock tax','rsu tax'],
    hypoTax:  ['假设税扣减','hypo tax','hypothetical tax'],
    // ----- Employer contributions -----
    siPersonal:   ['社会保险(个人)','社保','social insurance personal','si personal'],
    employerStat: ['雇主法定缴款','employer statutory','employer statutory contribution'],
    employerSupp: ['雇主补充福利保险','雇主补充','employer supplementary','supplementary benefit'],
    // ----- Finance -----
    serviceFee: ['服务费(不含税)','服务费','service fee','管理费'],
    vat:        ['薪资vat','服务费vat','vat'],
    thirdPartyReimb:['三方报销','third party reimbursement','3rd party reimburse'],
    deposit:    ['押金金额','押金','deposit'],
    // ----- Meta columns -----
    payGroup:   ['pay group','薪酬组','发薪组','paygroup'],
    payPeriod:  ['发薪周期','pay period','period','薪酬期间','payroll period'],
    employeeId: ['employee id','员工编号','工号','员工id','emp id','eid'],
    erp:        ['erp'],
    country:    ['国家','country'],
    region:     ['地区','region','大区'],
    company:    ['company','公司','法人主体','entity','legal entity'],
    supOrg:     ['supervisory organization','部门','department','所属部门','organization','dept'],
    currency:   ['currency','币种','结算币种','展示货币']
  };

  function detectField(header) {
    // Normalize: full-width brackets → half-width, lowercase, strip whitespace
    const norm = String(header)
      .replace(/[（]/g, '(').replace(/[）]/g, ')')
      .replace(/\s+/g, ' ')
      .trim().toLowerCase();
    if (!norm) return null;
    for (const k in HEADER_ALIASES) {
      if (HEADER_ALIASES[k].some(a => {
        const an = String(a).replace(/[（]/g,'(').replace(/[）]/g,')').toLowerCase();
        return norm === an || norm.includes(an);
      })) return k;
    }
    // exact key match in MOCK.FIELDS
    if (window.MOCK) {
      const f = MOCK.FIELDS.find(f => f.cn === header || f.en === header || f.key === header);
      if (f) return f.key;
    }
    return null;
  }

  // Aggregate Layer 2 totals from Layer 1 records
  function rollupL2(record) {
    const out = {};
    for (const k in record) {
      const v = +record[k] || 0;
      const l2 = L1_TO_L2[k];
      if (!l2) continue;
      out[l2] = (out[l2] || 0) + v;
    }
    return out;
  }
  function rollupL3(record) {
    const l2 = rollupL2(record);
    const out = {};
    for (const k in l2) {
      const l3 = L2_TO_L3[k];
      out[l3] = (out[l3] || 0) + l2[k];
    }
    return out;
  }

  function getL1ByL2(l2Key) {
    return Object.keys(L1_TO_L2).filter(k => L1_TO_L2[k] === l2Key);
  }
  function getL2ByL3(l3Key) {
    return Object.keys(L2_TO_L3).filter(k => L2_TO_L3[k] === l3Key);
  }

  return {
    L1_TO_L2, L2_TO_L3, L2_DEF, L3_DEF,
    detectField, rollupL2, rollupL3, getL1ByL2, getL2ByL3
  };
})();

/* ========== Workday Wide-Table Parser & Data Store ==========
   - Parses CSV / TSV entirely in the browser
   - Auto-detects 41+ Workday columns + Pay Group / Period / Entity meta
   - Aggregates raw records into country / dept / trend buckets
   - 100% offline
============================================================== */
window.Parser = (function () {
  console.log('[Parser] build 2026-05-13-v4 (full-width brackets fix + better preamble)');

  // -------- 1. CSV parser (RFC 4180 lite) --------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let cur = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i+1];
      if (inQ) {
        if (c === '"' && n === '"') { field += '"'; i++; }
        else if (c === '"') inQ = false;
        else field += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',' || c === '\t' || c === ';') { cur.push(field); field=''; }
        else if (c === '\r') {/* skip */}
        else if (c === '\n') { cur.push(field); rows.push(cur); cur=[]; field=''; }
        else field += c;
      }
    }
    if (field.length || cur.length) { cur.push(field); rows.push(cur); }
    return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
  }

  // -------- 2. Header → field key resolution --------
  function buildHeaderMap(headers) {
    const map = []; const matched = {};
    headers.forEach((h, i) => {
      const k = Mapping.detectField(h);
      map.push(k);
      if (k) matched[k] = h;
    });
    return { map, matched };
  }

  // -------- 3. Row → record object --------
  function rowToRecord(row, headerMap) {
    const r = {};
    headerMap.forEach((k, i) => {
      if (!k) return;
      const v = row[i];
      if (v == null || v === '') return;
      const cleaned = String(v).replace(/[,¥$£€\s]/g, '');
      const num = Number(cleaned);
      // Keep strings for non-numeric columns
      const stringFields = ['country','region','company','supOrg','currency','employeeId','erp','payGroup','payPeriod'];
      if (stringFields.includes(k) || isNaN(num) || cleaned === '') {
        r[k] = String(v).trim();
      } else {
        r[k] = num;
      }
    });
    return r;
  }

  // -------- 4. Aggregate records → MOCK-shaped buckets --------
  function aggregate(records) {
    if (!records.length) return null;

    // Country full-name → ISO-2 code (extends MOCK.COUNTRIES if needed)
    const NAME_TO_CODE = {
      'china':'CN','中国':'CN',
      'united states':'US','usa':'US','美国':'US',
      'germany':'DE','德国':'DE',
      'france':'FR','法国':'FR',
      'united kingdom':'GB','uk':'GB','英国':'GB','great britain':'GB',
      'netherlands':'NL','holland':'NL','荷兰':'NL',
      'japan':'JP','日本':'JP',
      'singapore':'SG','新加坡':'SG',
      'india':'IN','印度':'IN',
      'australia':'AU','澳大利亚':'AU',
      'canada':'CA','加拿大':'CA',
      'spain':'ES','西班牙':'ES',
      'italy':'IT','意大利':'IT',
      'poland':'PL','波兰':'PL',
      'belgium':'BE','比利时':'BE',
      'switzerland':'CH','瑞士':'CH',
      'south korea':'KR','korea':'KR','韩国':'KR'
    };
    const toCountryCode = (val) => {
      if (!val) return 'XX';
      const s = String(val).trim();
      if (/^[A-Za-z]{2}$/.test(s)) return s.toUpperCase();
      const k = s.toLowerCase();
      return NAME_TO_CODE[k] || s.toUpperCase().slice(0,2);
    };

    // ---- by country ----
    const byCountry = {};
    records.forEach(r => {
      const code = toCountryCode(r.country || r.region);
      if (!byCountry[code]) byCountry[code] = { code, hc:0, base:0, variable:0, overtime:0, mobility:0, benefit:0, tax:0, employer:0, finance:0 };
      const c = byCountry[code];
      c.hc += 1;
      c.base     += (+r.baseSalary||0)+(+r.postAllow||0)+(+r.tenureAllow||0)+(+r.seniorityAllow||0);
      c.variable += (+r.perfPay||0)+(+r.perfBonus||0)+(+r.yearBonus||0)+(+r.annualContribBonus||0)+(+r.referralBonus||0)+(+r.companyBonus||0);
      c.overtime += (+r.overtimePay||0)+(+r.holidayPay||0)+(+r.leaveCash||0);
      c.mobility += (+r.expatIncentive||0)+(+r.housingAllow||0)+(+r.livingAllow||0)+(+r.familyAllow||0)+(+r.taxEqual||0);
      c.benefit  += (+r.mealAllow||0)+(+r.transportAllow||0)+(+r.commAllow||0)+(+r.nightShiftAllow||0)+(+r.otherBenefit||0);
      c.tax      += (+r.iit||0)+(+r.stockTax||0)+(+r.hypoTax||0);
      c.employer += (+r.siPersonal||0)+(+r.employerStat||0)+(+r.employerSupp||0);
      c.finance  += (+r.serviceFee||0)+(+r.vat||0)+(+r.thirdPartyReimb||0)+(+r.deposit||0);
    });
    const div = 1000;
    const countryCost = Object.values(byCountry).map(c => {
      const total = (c.base+c.variable+c.overtime+c.mobility+c.benefit+c.tax+c.employer+c.finance)/div;
      const meta = (window.MOCK?.COUNTRIES || []).find(x=>x.code===c.code) || {cn:c.code, en:c.code, region:'—', cur:'—'};
      return {
        code:c.code, region: meta.region, currency: meta.cur, cn: meta.cn, en: meta.en,
        hc:c.hc, total,
        base:c.base/div, variable:c.variable/div, overtime:c.overtime/div,
        mobility:c.mobility/div, benefit:c.benefit/div, tax:c.tax/div, employer:c.employer/div, finance:c.finance/div,
        mom:0, yoy:0
      };
    });

    // ---- by department ----
    const byDept = {};
    records.forEach(r => {
      const d = (r.supOrg || r.company || 'OTHER').toString();
      if (!byDept[d]) byDept[d] = { id:d, cn:d, en:d, hc:0, base:0, variable:0, benefit:0, mobility:0, tax:0, employer:0, overtime:0 };
      const x = byDept[d];
      x.hc += 1;
      x.base     += (+r.baseSalary||0)+(+r.postAllow||0)+(+r.tenureAllow||0)+(+r.seniorityAllow||0);
      x.variable += (+r.perfPay||0)+(+r.perfBonus||0)+(+r.yearBonus||0)+(+r.companyBonus||0)+(+r.annualContribBonus||0)+(+r.referralBonus||0);
      x.overtime += (+r.overtimePay||0)+(+r.holidayPay||0)+(+r.leaveCash||0);
      x.benefit  += (+r.mealAllow||0)+(+r.transportAllow||0)+(+r.commAllow||0)+(+r.nightShiftAllow||0)+(+r.otherBenefit||0);
      x.mobility += (+r.expatIncentive||0)+(+r.housingAllow||0)+(+r.livingAllow||0)+(+r.familyAllow||0)+(+r.taxEqual||0);
      x.tax      += (+r.iit||0)+(+r.stockTax||0)+(+r.hypoTax||0);
      x.employer += (+r.siPersonal||0)+(+r.employerStat||0)+(+r.employerSupp||0);
    });
    const deptCost = Object.values(byDept).map(d => ({
      id:d.id, cn:d.id, en:d.id, hc:d.hc,
      total: (d.base+d.variable+d.overtime+d.benefit+d.mobility+d.tax+d.employer)/div,
      base:d.base/div, variable:d.variable/div, overtime:d.overtime/div,
      benefit:d.benefit/div, mobility:d.mobility/div, tax:d.tax/div, employer:d.employer/div,
      mom:0, yoy:0
    })).sort((a,b)=>b.total-a.total);

    // ---- topEmployees ----
    const topEmployees = records.slice().sort((a,b) => {
      const sb = (+b.baseSalary||0)+(+b.yearBonus||0)+(+b.perfBonus||0)+(+b.housingAllow||0);
      const sa = (+a.baseSalary||0)+(+a.yearBonus||0)+(+a.perfBonus||0)+(+a.housingAllow||0);
      return sb-sa;
    }).slice(0,30).map((r,i) => {
      const base = (+r.baseSalary||0)+(+r.postAllow||0)+(+r.tenureAllow||0);
      const bonus = (+r.perfBonus||0)+(+r.yearBonus||0)+(+r.annualContribBonus||0);
      const mob = (+r.housingAllow||0)+(+r.livingAllow||0)+(+r.familyAllow||0);
      const tax = (+r.iit||0)+(+r.stockTax||0);
      return {
        eid: r.employeeId || ('U'+String(10000+i)),
        name: r.employeeId || ('Employee '+(i+1)),
        country: (r.country||'XX').toString().toUpperCase().slice(0,2),
        dept: (r.supOrg||'').toString().slice(0,16),
        base, bonus, mobility: mob, tax,
        total: base + bonus + mob
      };
    });

    // ---- mobility detail ----
    const byCountryMob = {};
    records.forEach(r => {
      const code = (r.country || 'XX').toString().toUpperCase().slice(0,2);
      const housing = +r.housingAllow||0, living = +r.livingAllow||0, family = +r.familyAllow||0, te = +r.taxEqual||0;
      if (housing||living||family||te) {
        if (!byCountryMob[code]) byCountryMob[code] = { country:code, cn:code, en:code, hc:0, housing:0, living:0, family:0, taxEqual:0, total:0 };
        const x = byCountryMob[code];
        x.hc += 1;
        x.housing += housing/1000; x.living += living/1000; x.family += family/1000; x.taxEqual += te/1000;
        x.total = x.housing + x.living + x.family + x.taxEqual;
        const meta = (window.MOCK?.COUNTRIES || []).find(c=>c.code===code);
        if (meta) { x.cn = meta.cn; x.en = meta.en; }
      }
    });
    const mobility = Object.values(byCountryMob).sort((a,b)=>b.total-a.total);

    // ---- 12-month synthetic trend (single dataset = single period; trend won't be meaningful but kept for UI compatibility) ----
    const totalNow = countryCost.reduce((s,c)=>s+c.total,0);
    const months = []; const trend = [];
    const now = new Date();
    for (let i=11;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      months.push(m);
      const factor = 0.85 + (11-i)*0.02 + Math.sin(i)*0.03;
      const total = Math.round(totalNow * factor);
      trend.push({
        month: m, total,
        base: Math.round(total*0.55), variable: Math.round(total*0.18),
        mobility: Math.round(total*0.06), tax: Math.round(total*0.09),
        employer: Math.round(total*0.12),
        hc: Math.round(records.length * factor)
      });
    }

    // ---- forecast ----
    const last = trend[trend.length-1].total;
    const forecastMonths = []; const forecast = [];
    for (let i=1;i<=6;i++){
      const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      const m = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      forecastMonths.push(m);
      const v = last*(1+0.018*i);
      forecast.push({month:m, value:Math.round(v), lower:Math.round(v*0.94), upper:Math.round(v*1.06)});
    }

    // ---- anomalies ----
    const anomalies = [];
    countryCost.forEach((c,i) => {
      if (c.mobility/c.total > 0.12) anomalies.push({id:'A'+(100+i), metricKey:'mobility', countryCode:c.code, deptId:'-', deltaMoM:c.mobility/c.total-0.06, severity:'high', cn:`${c.cn} 派遣占比 ${(c.mobility/c.total*100).toFixed(1)}% 异常`, en:`${c.en} mobility share ${(c.mobility/c.total*100).toFixed(1)}% abnormal`});
      if (c.overtime/c.total > 0.06) anomalies.push({id:'A'+(200+i), metricKey:'overtime', countryCode:c.code, deptId:'-', deltaMoM:0.18, severity:'medium', cn:`${c.cn} 加班占比偏高`, en:`${c.en} overtime share is high`});
    });
    deptCost.slice(0,3).forEach((d,i) => {
      anomalies.push({id:'A'+(300+i), metricKey:'concentration', countryCode:'-', deptId:d.id, value:d.total/totalNow, severity:'medium', cn:`${d.cn} 占总成本 ${(d.total/totalNow*100).toFixed(1)}%`, en:`${d.en} carries ${(d.total/totalNow*100).toFixed(1)}%`});
    });

    return {
      countryCost, deptCost, trend, months,
      forecastMonths, forecast,
      anomalies, mobility, topEmployees,
      COUNTRIES: window.MOCK?.COUNTRIES || [],
      DEPTS:     window.MOCK?.DEPTS || [],
      FIELDS:    window.MOCK?.FIELDS || []
    };
  }

  // -------- 5. Read file (with encoding sniff: UTF-8 / GBK) --------
  function readFile(file, onProgress) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded/e.total*0.4); };
      reader.onerror = () => reject(reader.error || new Error('FileReader failed'));
      reader.onload = () => {
        const buf = reader.result;          // ArrayBuffer
        // Try UTF-8 first
        let text;
        try { text = new TextDecoder('utf-8', { fatal: false }).decode(buf); }
        catch(e) { text = ''; }
        // Heuristic: if too many U+FFFD replacements, fall back to GBK (Excel default in zh-CN)
        const repl = (text.match(/\uFFFD/g) || []).length;
        if (repl > 5 && /[\u4e00-\u9fa5]/.test(text) === false) {
          try {
            text = new TextDecoder('gbk').decode(buf);
          } catch(e) { /* GBK not supported, stay with utf-8 */ }
        }
        resolve(text);
      };
      reader.readAsArrayBuffer(file);   // read raw bytes so we can pick encoding
    });
  }

  // -------- 6. Extract metadata --------
  function extractMeta(records, fileName) {
    const counter = (key) => {
      const map = {};
      records.forEach(r => {
        const v = r[key];
        if (v == null || v === '') return;
        const s = String(v).trim();
        map[s] = (map[s] || 0) + 1;
      });
      return Object.entries(map).sort((a,b) => b[1] - a[1]);
    };
    const distinct = arr => arr.map(([v]) => v);
    const top = arr => arr.length ? arr[0][0] : '';

    const payGroups = counter('payGroup');
    const periods   = counter('payPeriod');
    const entities  = counter('company');
    const countries = counter('country');
    const depts     = counter('supOrg');

    function parsePeriod(s) {
      if (!s) return { start: null, end: null, label: '' };
      const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}).*?(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) {
        const start = `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
        const end   = `${m[6]}-${m[4].padStart(2,'0')}-${m[5].padStart(2,'0')}`;
        return { start, end, label: `${m[3]}-${m[1].padStart(2,'0')}` };
      }
      const ym = s.match(/(\d{4})[-/](\d{1,2})/);
      if (ym) {
        const yyyy = ym[1], mm = ym[2].padStart(2,'0');
        return { start: `${yyyy}-${mm}-01`, end: `${yyyy}-${mm}-28`, label: `${yyyy}-${mm}` };
      }
      return { start: null, end: null, label: s };
    }

    const payGroupTop = top(payGroups);
    const periodRaw   = top(periods);
    const periodInfo  = parsePeriod(periodRaw);
    const entityTop   = top(entities);

    let name = '';
    if (payGroupTop && periodInfo.label) name = `${payGroupTop} · ${periodInfo.label}`;
    else if (payGroupTop) name = payGroupTop;
    else if (periodInfo.label) name = periodInfo.label;
    else name = (fileName || 'Untitled').replace(/\.(csv|tsv|txt)$/i, '');

    return {
      name,
      payGroup: payGroupTop || '(unknown)',
      payGroups: distinct(payGroups),
      period: periodInfo.label || periodRaw || '(unknown)',
      periodRaw,
      periods: distinct(periods),
      periodStart: periodInfo.start,
      periodEnd: periodInfo.end,
      entity: entityTop || '(unknown)',
      entities: distinct(entities),
      countries: distinct(countries),
      depts: distinct(depts).slice(0, 50)
    };
  }

  // -------- 7. Top-level: full ingest with meta --------
  /**
   * Detect which row is the real header row.
   * Many Workday-exported reports prepend 3-10 metadata rows like:
   *   "海外薪酬 - 人力成本表"
   *   "Pay Group   DE Pay Group / FR Pay Group / GB Pay Group"
   *   "发薪周期    01/01/2026 - 01/31/2026 (Monthly)"
   *   "展示货币    EUR"
   *   ""
   *   "地区  国家  Employee ID  ERP  ...   <-- THIS is the real header"
   * Strategy: find the first row whose cells contain ≥3 known field aliases.
   */
  function detectHeaderRow(rows) {
    const MAX_SCAN = Math.min(rows.length, 30);
    let bestIdx = 0, bestScore = 0;
    const scores = [];
    for (let i = 0; i < MAX_SCAN; i++) {
      const row = rows[i] || [];
      const nonEmpty = row.filter(c => c != null && String(c).trim() !== '').length;
      if (nonEmpty < 3) { scores.push(0); continue; }
      let score = 0;
      row.forEach(c => {
        const k = window.Mapping && Mapping.detectField(String(c||'').trim());
        if (k) score++;
      });
      scores.push(score);
      if (score > bestScore) { bestScore = score; bestIdx = i; }
    }
    console.log('[Parser] Header detection scores per row:', scores, '→ picked row', bestIdx, 'with', bestScore, 'matches');
    return bestScore >= 3 ? bestIdx : 0;
  }

  /**
   * Parse the rows BEFORE the header row as "preamble metadata".
   * Returns { payGroups: [], periods: [], currency, entity }.
   * Handles Workday format where multiple Pay Groups are stuffed into one cell
   * separated by newlines:  "DE Pay Group\nFR Pay Group\nGB Pay Group"
   */
  function extractPreamble(preambleRows) {
    const out = { payGroups: [], periods: [], currency: '', entity: '' };
    const splitMulti = s => String(s||'').split(/[\r\n;|]+/).map(x=>x.trim()).filter(Boolean);
    preambleRows.forEach(row => {
      const cells = (row||[]).map(c => String(c||'').trim()).filter(Boolean);
      if (cells.length < 2) return;
      const label = cells[0].toLowerCase();
      const value = cells.slice(1).join(' ');
      if (/pay\s*group|薪酬组|发薪组/.test(label)) {
        out.payGroups = out.payGroups.concat(splitMulti(cells.slice(1).join('\n')));
      } else if (/period|周期|期间/.test(label)) {
        out.periods = out.periods.concat(splitMulti(cells.slice(1).join('\n')));
      } else if (/currency|币种|货币/.test(label)) {
        out.currency = value;
      } else if (/company|entity|主体|公司/.test(label)) {
        out.entity = value;
      }
    });
    return out;
  }

  async function ingestFull(file, onStep) {
    onStep && onStep('read', 0.05);
    const text = await readFile(file, p => onStep && onStep('read', p));
    onStep && onStep('parse', 0.45);
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('No data rows found');

    // -- Auto-detect real header row (skip preamble) --
    const headerIdx = detectHeaderRow(rows);
    const preambleRows = rows.slice(0, headerIdx);
    const preamble = extractPreamble(preambleRows);
    const headers = (rows[headerIdx] || []).map(h => String(h).trim());

    onStep && onStep('detect', 0.6);
    const { map: headerMap, matched } = buildHeaderMap(headers);
    const dataRows = rows.slice(headerIdx + 1).filter(r =>
      r.some(c => c != null && String(c).trim() !== '')
    );
    onStep && onStep('map', 0.75);
    const records = dataRows.map(r => rowToRecord(r, headerMap));

    // -- Inject preamble metadata into every record (so meta extraction works) --
    if (preamble.payGroups.length || preamble.periods.length || preamble.entity || preamble.currency) {
      const pg = preamble.payGroups[0] || '';
      const pp = preamble.periods[0] || '';
      records.forEach(r => {
        if (!r.payGroup && pg) r.payGroup = pg;
        if (!r.payPeriod && pp) r.payPeriod = pp;
        if (!r.company && preamble.entity) r.company = preamble.entity;
        if (!r.currency && preamble.currency) r.currency = preamble.currency;
      });
    }

    onStep && onStep('agg', 0.9);
    const aggregated = aggregate(records);
    const meta = extractMeta(records, file.name);
    // Override / enrich meta with preamble values when we have them
    if (preamble.payGroups.length) {
      meta.payGroups = preamble.payGroups;
      // If multiple Pay Groups are mixed in one file, label it as such
      meta.payGroup = preamble.payGroups.length === 1
        ? preamble.payGroups[0]
        : preamble.payGroups.join(' / ');
    }
    if (preamble.periods.length) {
      meta.periods = preamble.periods;
      meta.periodRaw = preamble.periods[0];
    }
    if (preamble.entity) meta.entity = preamble.entity;

    onStep && onStep('done', 1);
    return {
      headers, headerMap, matched,
      recordCount: records.length,
      records, aggregated, meta, preamble,
      sample: records.slice(0, 5)
    };
  }

  // Backward compat
  async function ingest(file, onStep) {
    const r = await ingestFull(file, onStep);
    return { headers: r.headers, headerMap: r.headerMap, matched: r.matched,
             recordCount: r.recordCount, dataset: r.aggregated, records: r.records,
             sample: r.sample, meta: r.meta, preamble: r.preamble };
  }

  // -------- 8. Sample CSV --------
  function generateSampleCSV(rowCount=200, opts={}) {
    const cols = ['payGroup','payPeriod','region','country','employeeId','erp','currency','company','supOrg',
      'baseSalary','postAllow','tenureAllow','perfBonus','yearBonus','referralBonus',
      'overtimePay','holidayPay','expatIncentive','housingAllow','livingAllow','familyAllow','taxEqual',
      'mealAllow','transportAllow','commAllow','iit','stockTax','siPersonal','employerStat','employerSupp',
      'serviceFee','vat'];
    const COUNTRIES = window.MOCK.COUNTRIES;
    const DEPTS = window.MOCK.DEPTS;
    const head = cols.map(k => {
      if (k === 'payGroup') return 'Pay Group';
      if (k === 'payPeriod') return '发薪周期';
      const f = window.MOCK.FIELDS.find(f=>f.key===k);
      return f ? f.cn : k;
    }).join(',');
    const lines = [head];
    const payGroup = opts.payGroup || (COUNTRIES[0].code + ' Pay Group');
    const period = opts.period || `01/01/2026 - 01/31/2026 (Monthly)`;
    const factor = opts.factor || 1;
    for (let i=0;i<rowCount;i++) {
      const c = COUNTRIES[i%COUNTRIES.length];
      const d = DEPTS[i%DEPTS.length];
      const isExpat = i%5===0;
      const r = [
        payGroup, period,
        c.region, c.code, 'E'+String(20000+i), 'ERP-'+(c.code), c.cur, 'JD '+c.cn, d.cn,
        Math.round((25000+Math.random()*60000)*factor), 1500+Math.round(Math.random()*3000), Math.round(Math.random()*1500),
        Math.round(Math.random()*15000*factor), Math.round(Math.random()*40000*factor), Math.round(Math.random()*2000),
        Math.round(Math.random()*4000*factor), Math.round(Math.random()*2000),
        isExpat?Math.round(8000+Math.random()*15000):0, isExpat?Math.round(15000+Math.random()*25000):0,
        isExpat?Math.round(5000+Math.random()*8000):0, isExpat?Math.round(2000+Math.random()*4000):0,
        isExpat?Math.round(5000+Math.random()*10000):0,
        500+Math.round(Math.random()*800), 300+Math.round(Math.random()*500), 100+Math.round(Math.random()*300),
        Math.round(2000+Math.random()*8000*factor), Math.round(Math.random()*3000),
        Math.round(800+Math.random()*1500), Math.round(3000+Math.random()*5000), Math.round(500+Math.random()*1500),
        Math.round(Math.random()*1200), Math.round(Math.random()*900)
      ];
      lines.push(r.join(','));
    }
    return '\uFEFF' + lines.join('\n');
  }

  return { parseCSV, buildHeaderMap, rowToRecord, aggregate, extractMeta, ingest, ingestFull, generateSampleCSV };
})();

/* ========== IndexedDB Persistent Storage Layer ==========
   - Each upload becomes an independent "Dataset" with metadata:
     { id, name, payGroup, period, periodStart, periodEnd, entity,
       country, dept, recordCount, uploadedAt, records[], aggregated{} }
   - Survives page reload / browser restart (until user clears site data)
   - 100% offline — no network calls
========================================================== */
window.Storage = (function () {
  const DB_NAME = 'jd-workforce-platform';
  const DB_VER = 2;
  const STORE_DS = 'datasets';
  let _db = null;

  function open() {
    return new Promise((resolve, reject) => {
      if (_db) return resolve(_db);
      if (!window.indexedDB) {
        // Fallback: in-memory store (no persistence)
        return resolve({ _mem: true });
      }
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_DS)) {
          const s = db.createObjectStore(STORE_DS, { keyPath: 'id' });
          s.createIndex('payGroup', 'payGroup', { unique: false });
          s.createIndex('period', 'period', { unique: false });
          s.createIndex('uploadedAt', 'uploadedAt', { unique: false });
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  // In-memory fallback when IndexedDB unavailable (file:// in some browsers)
  const _mem = { datasets: [] };

  async function tx(mode, fn) {
    const db = await open();
    if (db._mem) { return fn(_mem.datasets, true); }
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE_DS, mode);
      const store = t.objectStore(STORE_DS);
      let result;
      Promise.resolve(fn(store, false)).then(r => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  function makeId() {
    return'ds_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  async function put(dataset) {
    if (!dataset.id) dataset.id = makeId();
    if (!dataset.uploadedAt) dataset.uploadedAt = Date.now();
    return tx('readwrite', (store, isMem) => {
      if (isMem) {
        const i = store.findIndex(d => d.id === dataset.id);
        if (i >= 0) store[i] = dataset; else store.push(dataset);
        return dataset.id;
      }
      store.put(dataset);
      return dataset.id;
    });
  }

  async function get(id) {
    return tx('readonly', (store, isMem) => {
      if (isMem) return store.find(d => d.id === id) || null;
      return new Promise(res => {
        const r = store.get(id);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => res(null);
      });
    });
  }

  async function list() {
    return tx('readonly', (store, isMem) => {
      if (isMem) return [...store].sort((a,b) => b.uploadedAt - a.uploadedAt);
      return new Promise(res => {
        const r = store.getAll();
        r.onsuccess = () => res((r.result || []).sort((a,b) => b.uploadedAt - a.uploadedAt));
        r.onerror = () => res([]);
      });
    });
  }

  async function remove(id) {
    return tx('readwrite', (store, isMem) => {
      if (isMem) {
        const i = store.findIndex(d => d.id === id);
        if (i >= 0) store.splice(i, 1);
        return true;
      }
      store.delete(id);
      return true;
    });
  }

  async function clear() {
    return tx('readwrite', (store, isMem) => {
      if (isMem) { store.length = 0; return; }
      store.clear();
    });
  }

  async function listMeta() {
    const all = await list();
    return all.map(d => ({
      id: d.id, name: d.name, payGroup: d.payGroup, period: d.period,
      periodStart: d.periodStart, periodEnd: d.periodEnd,
      entity: d.entity, recordCount: d.recordCount,
      countries: d.countries, depts: d.depts,
      uploadedAt: d.uploadedAt, fileName: d.fileName, fileSize: d.fileSize
    }));
  }

  return { open, put, get, list, listMeta, remove, clear, makeId };
})();

/* ========== Multi-Dataset Manager ==========
   - Holds list of all uploaded datasets
   - Provides "active selection" for views (single / multi)
   - Hydrates from IndexedDB on app boot
============================================ */
window.Datasets = (function () {
  let cached = [];          // metadata only
  let activeIds = [];       // ids selected for current analysis
  const listeners = [];

  function emit() { listeners.forEach(fn => { try { fn(); } catch(e){} }); }
  function onChange(fn) { listeners.push(fn); }

  async function refresh() {
    cached = await Storage.listMeta();
    // auto-select most recent if no active
    if (!activeIds.length && cached.length) activeIds = [cached[0].id];
    // prune missing
    activeIds = activeIds.filter(id => cached.some(d => d.id === id));
    emit();
    return cached;
  }

  async function add(dataset) {
    await Storage.put(dataset);
    await refresh();
    activeIds = [dataset.id];     // auto-select the newly uploaded
    emit();
    return dataset.id;
  }

  async function remove(id) {
    await Storage.remove(id);
    await refresh();
    return true;
  }

  async function clearAll() {
    await Storage.clear();
    cached = []; activeIds = [];
    emit();
  }

  function all() { return cached.slice(); }
  function getActiveIds() { return activeIds.slice(); }
  function setActive(ids) { activeIds = Array.isArray(ids) ? ids : [ids]; emit(); }
  function toggleActive(id, on) {
    const has = activeIds.includes(id);
    const want = typeof on === 'boolean' ? on : !has;
    if (want && !has) activeIds.push(id);
    if (!want && has) activeIds = activeIds.filter(x => x !== id);
    emit();
  }

  async function rename(id, newName) {
    const full = await Storage.get(id);
    if (!full) return false;
    full.name = newName;
    await Storage.put(full);
    await refresh();
    return true;
  }
  async function getFull(id) { return Storage.get(id); }

  // Resolve full datasets (records + aggregated) from active ids
  async function getActiveFull() {
    const out = [];
    for (const id of activeIds) {
      const d = await Storage.get(id);
      if (d) out.push(d);
    }
    return out;
  }

  // Distinct values across all loaded datasets (for filter dropdowns)
  function distinctPayGroups() { return [...new Set(cached.map(d => d.payGroup).filter(Boolean))]; }
  function distinctPeriods()   { return [...new Set(cached.map(d => d.period).filter(Boolean))].sort(); }
  function distinctEntities()  { return [...new Set(cached.map(d => d.entity).filter(Boolean))]; }

  return {
    refresh, add, remove, clearAll,
    all, list: all,                            // alias: list()
    getActiveIds, activeIds: getActiveIds,     // alias: activeIds()
    setActive, toggleActive, getActiveFull,
    rename, get: getFull,                      // rename + get(id) full
    onChange,
    distinctPayGroups, distinctPeriods, distinctEntities
  };
})();

/* ========== Analytics Engine ========== */
window.Analytics = (function () {
  // ------ KPI calc ------
  function globalKPI() {
    const cc = MOCK.countryCost;
    const total = cc.reduce((s, c) => s + c.total, 0) * 1000; // thousand -> base
    const hc    = cc.reduce((s, c) => s + c.hc, 0);
    const fixed = cc.reduce((s, c) => s + c.base, 0) * 1000;
    const variable = cc.reduce((s, c) => s + c.variable, 0) * 1000;
    const overtime = cc.reduce((s, c) => s + c.overtime, 0) * 1000;
    const mobility = cc.reduce((s, c) => s + c.mobility, 0) * 1000;
    const benefit  = cc.reduce((s, c) => s + c.benefit, 0) * 1000;
    const tax      = cc.reduce((s, c) => s + c.tax, 0) * 1000;
    const employer = cc.reduce((s, c) => s + c.employer, 0) * 1000;
    return {
      total, hc, cph: hc ? Math.round(total/hc) : 0,
      fixedRatio: fixed/total, bonusRatio: variable/total, overtimeRatio: overtime/total,
      mobilityRatio: mobility/total, benefitRatio: benefit/total, taxRatio: tax/total, siRatio: employer/total
    };
  }

  // ------ Cost concentration (Top-N) ------
  function concentration(arr, key='total') {
    const sorted = [...arr].sort((a,b) => b[key]-a[key]);
    const total = arr.reduce((s,a)=>s+a[key],0);
    const top3 = sorted.slice(0,3).reduce((s,a)=>s+a[key],0);
    const top10 = sorted.slice(0,10).reduce((s,a)=>s+a[key],0);
    return { top3: top3/total, top10: top10/total, total, sorted };
  }

  // ------ Linear forecast (fallback when no Prophet) ------
  function linearForecast(series, n=6) {
    const len = series.length;
    const xMean = (len-1)/2;
    const yMean = series.reduce((s,v)=>s+v,0)/len;
    let num=0, den=0;
    series.forEach((y,i)=>{ num += (i-xMean)*(y-yMean); den += (i-xMean)**2; });
    const slope = num/den, intercept = yMean - slope*xMean;
    const out = [];
    for (let i=0;i<n;i++){
      const x = len + i;
      const v = intercept + slope*x;
      out.push({value: v, lower: v*0.94, upper: v*1.06});
    }
    return out;
  }

  // ------ Anomaly detection (Z-Score on a series) ------
  function zScoreAnomalies(series, threshold=2) {
    const mean = series.reduce((s,v)=>s+v,0)/series.length;
    const sd = Math.sqrt(series.reduce((s,v)=>s+(v-mean)**2,0)/series.length);
    return series.map((v,i) => ({ idx:i, value:v, z:(v-mean)/sd, anomaly: Math.abs((v-mean)/sd) > threshold }));
  }

  // ------ Org Health Score ------
  function healthScore() {
    const k = globalKPI();
    const conc = concentration(MOCK.deptCost);
    // sub scores 0-100
    const costHealth     = Math.round(100 - Math.min(60, (k.mobilityRatio + k.overtimeRatio)*200));
    const workloadHealth = Math.round(100 - Math.min(50, k.overtimeRatio*1500));
    const hcStability    = Math.round(82 + Math.random()*6);
    const flexibility    = Math.round(60 + k.bonusRatio*120);
    const incentive      = Math.round(70 + k.bonusRatio*100);
    const concRisk       = Math.round(100 - conc.top3*100);
    const overall = Math.round((costHealth + workloadHealth + hcStability + flexibility + incentive + concRisk) / 6);
    return { overall, costHealth, workloadHealth, hcStability, flexibility, incentive, concRisk };
  }

  // ------ MoM/YoY/QoQ ------
  function mom(series) {
    if (series.length<2) return 0;
    return (series[series.length-1] - series[series.length-2]) / series[series.length-2];
  }
  function yoy(series) {
    if (series.length<13) return null;
    return (series[series.length-1] - series[series.length-13]) / series[series.length-13];
  }

  // ------ AI insights generation (rule-based local) ------
  function aiInsights() {
    const lang = I18N.get();
    const k = globalKPI();
    const conc = concentration(MOCK.deptCost);
    const lastTrend = MOCK.trend[MOCK.trend.length-1];
    const prevTrend = MOCK.trend[MOCK.trend.length-2];
    const trendMoM = (lastTrend.total - prevTrend.total) / prevTrend.total;

    const insights = [];
    insights.push({
      level: 'good',
      tag: lang==='zh'?'执行摘要':'EXEC',
      text: I18N.t('ai.bullet.5')
    });
    insights.push({
      level: trendMoM > 0.05 ? 'warn' : 'good',
      tag: lang==='zh'?'成本趋势':'TREND',
      text: lang==='zh'
        ? `当月全球用工成本较上月 ${(trendMoM*100).toFixed(1)}%,合计 ¥${(lastTrend.total/1e4).toFixed(1)}万。`
        : `Global labor cost MoM ${(trendMoM*100).toFixed(1)}%, total ¥${(lastTrend.total/1e4).toFixed(1)}K.`
    });
    insights.push({ level: 'warn', tag: lang==='zh'?'派遣异常':'MOBILITY', text: I18N.t('ai.bullet.1') });
